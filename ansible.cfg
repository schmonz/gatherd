[defaults]
inventory = inventory
connection = local
inject_facts_as_vars = False

# Per-task timings on every run, so "where did the converge spend its time" is
# answerable from the journal instead of reconstructed afterwards from package
# mtimes -- which is what we had, and which got the answer wrong: repacking the
# -bin AUR packages measured at ~1-2 CPU-minutes of a 29-minute run, not the
# bulk anyone assumed.
#
# profile_tasks is NOT in ansible-core; it ships in ansible.posix, which comes
# with the full `ansible` package that postinstall installs. If it ever goes
# missing ansible warns ("Skipping callback plugin ... unable to load") and the
# run continues at exit 0 -- measured -- so this cannot block a converge.
callbacks_enabled = ansible.posix.profile_tasks

[callback_profile_tasks]
# `all`, not the default 20: site-async.yml alone imports ~5,200 lines of tasks
# across seven roles, and a top-20 cut hides everything but the AUR builds.
task_output_limit = all
