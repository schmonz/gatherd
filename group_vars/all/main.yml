# Tablet mode. Gated on capability rather than model: DMI is useless here, since
# the MiniBook X reports chassis_type 10 (Notebook), not 31 (Convertible).
tablet_mode_supported: "{{ has_touchscreen | default(false) and has_accelerometer | default(false) }}"
# Portrait. NOT 90: where the panel is physically mounted rotated, wlroots
# applies the DRM orientation quirk itself and 90 is upright landscape. Use 180
# if the fold puts the wrong edge at the top.
tablet_mode_transform: normal
music_stand_root: "{{ target_home }}/Documents/forscore"
# music_stand_viewer, music_stand_app_id and music_stand_fullscreen_flag must
# all three change together: the app_id is what
# roles/desktop/tasks/tablet_mode.yml's for_window rule (idle-inhibit while
# visible) matches against, and the fullscreen flag is what
# scripts/gatherd-music-stand passes when launching the viewer so fullscreen
# actually sticks — sway's own `fullscreen enable` rule fires but papers
# restores its own persisted window state moments later and clobbers it
# (confirmed by event trace), so the flag, not the sway rule, is what makes
# fullscreen stick. Neither follows from the package name. Switching the
# viewer without updating both mappings below leaves the idle-inhibit rule
# matching nothing (screen blanks mid-piece, the one thing this feature
# exists to prevent) and/or the score opening windowed instead of fullscreen.
# xreader's app_id AND its fullscreen flag below are the documented zero-cost
# fallback (evince/xreader's GtkApplication ID, and its `-f` flag by analogy
# with papers) — confirm both with `swaymsg -t get_tree` and a live launch
# before relying on them, since neither has been exercised on this hardware.
music_stand_viewer_app_ids:
  papers: org.gnome.Papers
  xreader: xreader
music_stand_viewer_fullscreen_flags:
  papers: -f
  xreader: -f
music_stand_viewer: papers
music_stand_app_id: "{{ music_stand_viewer_app_ids[music_stand_viewer] }}"
music_stand_fullscreen_flag: "{{ music_stand_viewer_fullscreen_flags[music_stand_viewer] }}"

# iCloud Drive sync. The folder list is data on purpose: widening coverage is a
# list edit, not a code change. Downloads is excluded on the merits — 310 MB of
# constantly-churning share-sheet detritus is a poor fit for a bisync pair with a
# max-delete tripwire.
icloud_remote: icloud
icloud_sync_root: "{{ target_home }}/Documents/iCloud"
icloud_filters_base:
  - "- .DS_Store"
  - "- ._*"
  - "- *.icloud"
icloud_sync_folders:
  - remote: FSNotes
    filters:
      - "- projects.state"
      - "- *.textbundle"
      - "- /Trash/**"
