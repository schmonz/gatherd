    codename: Poe
  # iCloud/Apple + the rest below would otherwise get DuckDuckGo's 32-48px favicon
  # — too blurry at the app-menu size — and the four iCloud apps share one host
  # (icloud.com), so DDG would hand them all the same generic icon. Pin each to its
  # official 512px App Store artwork instead (from the iTunes Search API,
  # `itunes.apple.com/search?term=...&entity=software` -> artworkUrl512). These
  # mzstatic URLs are versioned; if Apple reworks an icon the verify step catches
  # the straggler and the URL is refreshed from the same API.
  - name: iCloud Drive
    url: https://www.icloud.com/iclouddrive
    comment: iCloud
    codename: iCloudDrive
    # No standalone "iCloud Drive" App Store app; Files is Apple's file browser
    # that fronts iCloud Drive and carries the recognizable icon.
    icon_url: https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/cf/a1/e7/cfa1e733-abf2-2a89-394f-1de4a5043743/files-0-0-1x_U007epad-0-1-0-sRGB-85-220.png/512x512bb.png
