# Tablet mode. Gated on capability rather than model: DMI is useless here, since
# the MiniBook X reports chassis_type 10 (Notebook), not 31 (Convertible).
tablet_mode_supported: "{{ has_touchscreen | default(false) and has_accelerometer | default(false) }}"
# The fold detection, rotation, input suppression and escape menu are a
# property of the hardware, not of this setup, and live in their own repo now
# - see roles/desktop/tasks/tablet_mode_upstream.yml. Pinned rather than
# tracking main so a repave two years from now reproduces what runs today;
# upgrading is a one-line bump. Cloning is a network operation, so it happens
# in REST (roles/desktop/tasks/rest.yml), never CORE, which must converge
# with no internet at all.
tablet_mode_upstream_repo: https://github.com/schmonz/chuwi-minibook-tablet-mode.git
tablet_mode_upstream_version: 0.0.20260821.1
tablet_mode_upstream_dir: "{{ target_home }}/.local/src/chuwi-minibook-tablet-mode"
# What gatherd puts in the folded menu. The mechanism ships knowing none of
# this; the sheet-music reader is ours.
tablet_mode_menu_entries:
  - label: "󰈙 Pick another score"
    command: gatherd-music-stand on
  - label: "󰎈 Close score"
    command: gatherd-music-stand close
# Portrait. NOT 90: where the panel is physically mounted rotated, wlroots
# applies the DRM orientation quirk itself and 90 is upright landscape. Use 180
# if the fold puts the wrong edge at the top.
tablet_mode_transform: normal
# Hinge-fold trigger (phase 2): minibook-hinge-daemon's enter/exit hysteresis
# band, in degrees of |theta| away from folded (theta is the hinge angle
# itself - see the daemon's own header for the geometry, and the design spec
# for why a signed angle alone cannot tell a shut lid from a folded tablet).
# Calibrated on a moving train, where measured jitter was 8.1 degrees, so this
# band is deliberately generous pending a re-measurement somewhere stationary.
# Typing reads theta=108 and flat reads theta=178, both well clear of the
# band; fully folded reads theta~=-2, well inside it.
tablet_mode_fold_enter_deg: 30
tablet_mode_fold_exit_deg: 50
# Re-measured stationary (the note above): theta stdev at rest is 2.95
# degrees, raw spread 16.2 degrees over 12s at 20Hz. Residual spread after a
# rolling median: 10.7 deg at window 3, 6.8 at window 5, 4.5 at window 10
# (the old default), 3.5 at window 20. window 5 at a 0.1s poll cuts reaction
# latency from ~5s to ~0.5s while keeping ~4x headroom against
# tablet_mode_fold_enter_deg's 30-degree band. A false ENTER from typing
# angle (theta~=108) would need a ~78-degree excursion - about 26 standard
# deviations of the measured noise - and the lid-switch gate blocks entry
# outright whenever the lid reads closed, so that headroom is not spent on
# resting-state noise. What a shorter window gives up is smoothing of
# transients while the hinge is genuinely in motion (a captured fold showed
# intermediate readings before settling); accepted because entering tablet
# mode slightly early during a deliberate fold is harmless. A reader
# shortening this further should re-check both numbers against this table.
tablet_mode_hinge_poll_interval: 0.1
tablet_mode_hinge_median_window: 5
# Auto-rotation (phase 3): follows the tablet's orientation in the hands
# while tablet mode is active, reusing the same lid-sensor read above - see
# minibook-hinge-daemon's module header for the full geometry and the
# measured calibration table this value comes from. This is the atan2(y, x)
# reading of the lid sensor's gravity vector, measured BY HAND on this
# hardware, in the upright "normal" reading position. A config value, not a
# constant in the script, so re-calibrating on other hardware is an edit
# here, never a code change: hold the folded tablet in the normal reading
# position and read in_accel_{x,y}_raw off the lid sensor (iio:device0)
# directly to re-derive it. Hold it in PORTRAIT to do that, and check the
# reading is ~90 degrees away from what the same sensor reads with the
# machine sitting open as a laptop: an earlier value of 177.0 was captured
# in the landscape/laptop orientation by mistake, which is indistinguishable
# from a good calibration except that every quadrant then comes out a
# quarter turn anticlockwise.
# Adaptive rate: sample slowly while stationary, snap to poll_interval on
# motion. Motion thresholds are in degrees of deviation from the running
# median, measured at rest on this hardware over 20s of sampling: raw |theta|
# strays at most 7.77 degrees from its median (p99 6.62), raw rotation at most
# 0.65. The defaults sit 2.6x and 15x above those ceilings, while a real fold
# moves theta ~100 degrees and a real turn moves rotation 90.
tablet_mode_hinge_poll_interval_idle: 0.5
tablet_mode_hinge_motion_theta_deg: 20.0
tablet_mode_hinge_motion_rotation_deg: 10.0
tablet_mode_hinge_motion_hold_seconds: 3.0
# Where the power button goes when the machine is not folded. EndeavourOS
# ships this; it is the only path in tablet mode that assumes a particular
# desktop, so it is a value rather than a hardcoded string in the script.
tablet_mode_power_menu: "{{ target_home }}/.config/sway/scripts/power_menu.sh"
tablet_mode_rotation_reference_deg: 267.0
music_stand_root: "{{ target_home }}/Documents/forscore"
# music_stand_viewer, music_stand_app_id and music_stand_viewer_flag must
# all three change together: the app_id is what
# roles/desktop/tasks/tablet_mode.yml's for_window rule (idle-inhibit while
# visible) matches against, and the viewer flag is what
# scripts/gatherd-music-stand passes when launching the viewer to select
# presentation mode — chosen over fullscreen-only display because the human
# wants to tap to turn the page at the piano, not scroll, and presentation
# mode is inherently fullscreen too (a re-captured event trace shows
# fullscreen_mode=1 the moment it launches, no race with sway's own rule the
# way plain fullscreen had). Neither the app_id nor the flag follows from the
# package name. Switching the viewer without updating both mappings below
# leaves the idle-inhibit rule matching nothing (screen blanks mid-piece, the
# one thing this feature exists to prevent) and/or the score opening in
# ordinary scrolling view instead of tap-to-turn presentation mode.
# xreader's app_id AND its viewer flag below are the documented zero-cost
# fallback (evince/xreader's GtkApplication ID, and its `-s` presentation-mode
# flag by analogy with papers, both of which share Evince ancestry) — confirm
# both with `swaymsg -t get_tree` and a live launch before relying on them,
# since neither has been exercised on this hardware.
#
# koreader is what is actually used. It is the only one of the three that can
# go BACKWARDS by touch: papers maps a primary click to next-page and offers
# no zone logic at all, so a mis-tapped page could not be undone without a
# keyboard, which tablet mode has disabled. koreader has configurable tap
# zones (left = back) and, as a bonus, crops each page to its printed content
# so the staves come out larger.
#
# Its three values are each surprising, and none follows from the package
# name:
#   app_id  luajit  - the window belongs to reader.lua, a CHILD of the
#                     koreader wrapper script, and carries the interpreter's
#                     app_id rather than the application's. Confirmed with
#                     `swaymsg -t get_tree` against a live launch.
#   flag    (none)  - page mode, tap zones and zoom are koreader's own
#                     persistent settings, not per-launch flags.
#   env             - SDL3 otherwise picks x11 and runs through XWayland,
#                     where touch arrives as synthesised mouse events and the
#                     display transform goes through a translation layer. The
#                     whole point here is real wl_touch on a rotating panel.
music_stand_viewer_app_ids:
  papers: org.gnome.Papers
  xreader: xreader
  koreader: luajit
music_stand_viewer_flags:
  papers: -s
  xreader: -s
  koreader: ""
music_stand_viewer_envs:
  papers: ""
  xreader: ""
  koreader: SDL_VIDEODRIVER=wayland
music_stand_viewer: koreader
music_stand_app_id: "{{ music_stand_viewer_app_ids[music_stand_viewer] }}"
music_stand_viewer_flag: "{{ music_stand_viewer_flags[music_stand_viewer] }}"
music_stand_viewer_env: "{{ music_stand_viewer_envs[music_stand_viewer] }}"

# iCloud Drive sync. The folder list is data on purpose: widening coverage is a
# list edit, not a code change. Downloads is excluded on the merits — 310 MB of
# constantly-churning share-sheet detritus is a poor fit for a bisync pair with a
# max-delete tripwire.
icloud_remote: icloud
icloud_sync_root: "{{ target_home }}/Documents/iCloud"
icloud_filters_base:
  - "- .DS_Store"
  - "- ._*"
  - "- *.icloud"
icloud_sync_folders:
  - remote: FSNotes
    filters:
      - "- projects.state"
      - "- *.textbundle"
      - "- /Trash/**"
