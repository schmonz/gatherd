---
setup_dir: "/usr/local/lib/gatherd"
nfs_server: ap-juicer.taile54b91.ts.net

# Hardcoded per-user/per-machine config. Replace with a real delivery mechanism
# (extra-vars file, host_vars, Calamares-staged file, etc.) when this repo grows
# configurability; consumers reference these by name.
hardcoded_dotfiles_repo: "https://github.com/schmonz/dotfiles.git"
hardcoded_ssh_authorized_keys_dotfile: ssh-authorized-keys

# Claude Code preconfiguration. The marketplace + plugin are written as
# declarative intent into ~/.claude/settings.json (extraKnownMarketplaces +
# enabledPlugins); Claude Code itself clones and installs them on the first
# authenticated launch, as part of its normal plugin sync. The skill needs no
# such trigger — a standalone SKILL.md dropped into ~/.claude/skills/ is live
# immediately. The marketplace NAME (the key, and the @suffix on the plugin) is
# the `name` field from the marketplace's marketplace.json, not the repo slug.
claude_plugin_marketplace_name: superpowers-marketplace
claude_plugin_marketplace_repo: obra/superpowers-marketplace
claude_plugin_name: superpowers
claude_skill_name: doubt-driven-development
claude_skill_url: "https://raw.githubusercontent.com/addyosmani/agent-skills/main/skills/doubt-driven-development/SKILL.md"
# wifi_networks is defined entirely in vault — SSIDs are personal data, not just PSKs.
# Desktop wallpaper + gtklock background + GRUB menu background. The images are
# committed to the repo under backgrounds/ (= setup_dir/backgrounds), so they are
# already present at playbook time — no runtime fetch, which also lets a repave
# succeed offline or behind a captive portal. Refresh or change them at dev time
# with scripts/gatherd-fetch-wallpapers (which holds the upstream source URLs),
# then commit. Two variants — same composition, dark-blue vs pink sky — so the
# wallpaper can follow the GTK light/dark scheme; the lock screen and GRUB always
# use the dark one. Both consumers read from the cache path below: GRUB at boot,
# the desktop/lock screen via local copies in the user's home. The .jpg extension
# matters because GRUB's 00_header picks its image loader by extension; it maps
# .jpg to the jpeg reader, which decodes baseline JPEG only (see
# scripts/gatherd-fetch-wallpapers, which encodes accordingly).
wallpaper_cache_dir: "{{ setup_dir }}/backgrounds"
wallpaper_cache_dark: "{{ wallpaper_cache_dir }}/wallpaper-dark.jpg"
wallpaper_cache_light: "{{ wallpaper_cache_dir }}/wallpaper-light.jpg"

# Where roles/hardware/tasks/grub_background.yml drops a pre-turned copy of the
# dark wallpaper on a machine whose panel is physically mounted rotated. Outside
# setup_dir on purpose: that is a git clone, and a generated file has no business
# dirtying it. Only GRUB reads this one — every other consumer draws after the
# kernel has already straightened the panel.
wallpaper_grub_rotated: /usr/local/share/gatherd/wallpaper-dark-rotated.jpg
wallpaper_dir: "{{ target_home }}/.local/share/backgrounds"
wallpaper_dark_path: "{{ wallpaper_dir }}/wallpaper-dark"
wallpaper_light_path: "{{ wallpaper_dir }}/wallpaper-light"

# Package sets — single source of truth. The offline-cache builder
# (scripts/gatherd-build-offline-cache) downloads these exact lists, so the USB
# stick can never drift from what the playbook installs. Tier (core/rest) is on
# the *network* axis, not importance: CORE must converge with no internet at all.
#
# Hardware-gated packages deliberately stay inline in their own tiny task files
# (roles/hardware/tasks/*.yml, plus grub-btrfs / v4l-utils / keyd / thinkfan /
# python-validity), where the `has_*` gate and the package sit together. They are
# per-machine, so a generic cache stick cannot predict them anyway.

# Local-only essentials installed in CORE. Empty today: the monolith still runs
# as one play, and CORE prefers packages the EndeavourOS ISO already left behind.
# The CORE/REST split fills this in if anything turns out to be genuinely needed
# before greetd.
core_packages: []

# Official repo packages, installed in the main run.
rest_packages:
  # fakeroot + cc, needed by the vendored nowayprompt build
  # (roles/system/tasks/nowayprompt.yml), which runs before the aur role
  # would otherwise pull this in as an AUR build dependency.
  - base-devel
  # cargo, for the same vendored build, and for arch-update's makedepends.
  # Declared as "rust" because that is the package: cargo is only a provides,
  # so pacman cannot install it by that name.
  - rust
  # aurutils' runtime dependencies. It is built from a vendored PKGBUILD with
  # plain makepkg (no -s), so nothing installs these on its behalf; they have
  # to be here or the bootstrap in roles/system/tasks/aurutils.yml fails.
  # git is declared below with the rest of the version-control tools.
  - pacutils
  - curl
  - perl
  - perl-json-xs
  - bash
  # Providers for the virtual dependencies of AUR packages we build. makepkg
  # runs without -s and so cannot install a missing dependency itself; each of
  # these has to be present before the build that needs it. pacman cannot
  # install a virtual by name, so the real provider is named instead.
  - gtk3          # libgtk-3.so, for 1password
  - gnome-keyring # org.freedesktop.secrets, for jetbrains-toolbox
  - ttf-dejavu    # ttf-font, for zoom
  # The fifth virtual, udev, is provided by systemd, which the `base` group
  # guarantees on every Arch install; declaring it would only invite pacman to
  # reconsider a core package.
  # cloud sync. Was in aur_slow_packages, but rclone has been in [extra] for a
  # while; yay installed it from there regardless of which list named it.
  - rclone
  # version control + /etc tracking
  - etckeeper
  - git
  - git-delta
  # bluetooth
  - blueman
  # networking
  - gvfs-dnssd
  - nfs-utils
  - tailscale
  # firmware updates
  - fwupd
  # text editor
  - xed
  # PDF reading generally. NOT the music-stand viewer any more - see
  # music_stand_viewer below - but kept as the desktop default for opening a
  # PDF with a keyboard and a mouse, which is what it is good at.
  - papers
  # lightweight fallback browser for low-end/constrained machines
  - netsurf
  # favicon conversion for web-app desktop entries (ICO→PNG for fuzzel)
  - python-pillow
  # printing
  - cups
  - cups-browsed
  - system-config-printer
  # desktop portals: wlr handles screenshot/screencast; gtk handles Settings
  # only (for Qt dark mode via QT_QPA_PLATFORMTHEME=xdgdesktopportal). The
  # Location (geolocation) interface is not implemented by wlr and is
  # explicitly excluded from gtk via portals.conf, so geolocation stays off.
  - xdg-desktop-portal
  - xdg-desktop-portal-wlr
  - xdg-desktop-portal-gtk
  # remote GUI: VNC bound to localhost, reached over an SSH tunnel (see
  # plans/VNC.md). wayvnc serves this machine (no service — a session cohort
  # child); remmina is the client for reaching other machines, with built-in
  # SSH-tunnel support matching the same model. libvncserver is remmina's VNC
  # plugin (an optdepend, so name it explicitly).
  - wayvnc
  - remmina
  - libvncserver
  # system tools
  - btop
  - conky
  - inotify-tools
  # parses sway IPC events for gatherd-intercept-localsend-flash
  - jq
  - fastfetch
  - tmux
  - the_silver_searcher
  - xorg-xhost
  # dev tools
  - ansible-lint
  - shellcheck
  - glow
  - tig
  - github-cli
  - socat
  - bats
  # vm testing
  - qemu-base
  - qemu-ui-gtk
  - mtools
  # power management
  - tlp
  - tlp-rdw
  - powertop
  # pacman cache cleanup
  - pacman-contrib
  # cron daemon
  - cronie

# Big official-repo downloads, deferred to the async play (roles/system/tasks/slow.yml).
rest_slow_packages:
  - guvcview
  - libreoffice-fresh
  - abiword

# Same, but with no aarch64 build in the official repos.
rest_slow_x86_packages:
  - signal-desktop
  - apostrophe

# Fast AUR builds, installed in the main run (roles/aur/tasks/main.yml).
aur_packages:
  # automount
  - autofs
  # password manager
  - 1password
  - 1password-cli
  # web browsers
  - helium-browser-bin
  - captive-browser
  # snapshots
  - timeshift-autosnap
  # update notifier
  - arch-update
  - xdg-terminal-exec
  # sheet music at the piano: the music-stand viewer. Chosen over papers
  # because it can turn pages BACKWARDS by touch (configurable tap zones),
  # which papers structurally cannot - see music_stand_viewer below.
  - koreader-bin
  # polkit agent that drives any prompt command (we point it at fuzzel)
  - cmd-polkit-git
  # The playbook builds AUR packages with aurutils and needs no helper, but
  # arch-update -- the update notifier the desktop role configures -- only
  # knows paru, yay and pikaur, and silently ignores AUR packages if none is
  # installed. So yay stays, as the notifier's helper rather than ours. It is
  # a binary package, so building it here costs nothing.
  - yay-bin

# Long AUR builds and big binary drops, deferred to the async play
# (roles/aur/tasks/slow.yml).
aur_slow_packages:
  # file transfer
  - localsend-bin
  # communication
  - piavpn-bin
  - vesktop-bin
  - slack-electron
  - zoom
  - teams-for-linux-electron-bin
  # writing
  - dawn-writer-bin
  # AI tools (the Electron desktop app runs on any CPU; the native
  # claude-code bundle needs AVX — see aur_slow_avx_packages)
  - claude-desktop-bin
  # IDE manager
  - jetbrains-toolbox

# Same, but SIGILLs on pre-AVX CPUs — gated on has_avx.
aur_slow_avx_packages:
  - claude-code
  - claude-cowork-service

# Local pacman repository that AUR builds land in. aurutils builds each package
# as the unprivileged target_user and adds it here with repo-add; root then
# installs it with an ordinary `pacman -S`. That is the whole reason this repo
# exists: it splits "build" from "install" so the build half never needs root,
# and no transient sudoers grant has to be issued and revoked around it.
#
# The directory is writable by target_user (repo-add runs as that user) and the
# pacman.conf entry trusts it unsigned, so target_user can put a package here
# that root will install by name. That is the same trust already implied by
# running their makepkg output as a package; what it is NOT is the standing
# `pacman -U <any file>` a NOPASSWD grant leaves behind if the play is killed.
aur_repo_name: gatherd-aur
aur_repo_dir: /var/cache/gatherd-aur

# The one way this repo builds an AUR package. Defined once because every flag
# is load-bearing and was checked against aurutils 20.5.8's own source and man
# pages rather than guessed:
#   --database    build into our repo by name, instead of letting aur-sync
#                 guess at the first file:// repo in pacman.conf
#   --no-view     skip the interactive review of build files
#   --no-confirm  makepkg --noconfirm
#   --no-sync     skip aurutils' own `sudo pacsync` + `sudo pacman -S` after
#                 repo-add. This is the flag that makes the build half
#                 privilege-free. It is accepted by aur-sync (it is in its
#                 opt_long list) but absent from aur-sync(1), so it looks
#                 optional and is not.
#   --makepkg-args --skippgpcheck   what the old kewlfft.aur.aur tasks passed
#                 as `--mflags --skippgpcheck`. The value is comma-separated if
#                 more are ever needed.
# Append package names to this.
aur_sync_command: >-
  aur sync --database {{ aur_repo_name }}
  --no-view --no-confirm --no-sync
  --makepkg-args --skippgpcheck

# aur-sync passes --syncdeps to aur-build unconditionally and offers no flag to
# stop it, so makepkg still tries to resolve dependencies. With everything it
# needs already installed it finds nothing missing and never escalates -- but
# "never" should not rest on that. PACMAN_AUTH is makepkg's escalation hook and
# AUR_PACMAN_AUTH is aurutils' own; pointing both at /bin/false turns any
# attempt to reach for root into an immediate, legible build failure instead of
# a sudo password prompt nobody is sitting in front of.
aur_build_environment:
  PACMAN_AUTH: /bin/false
  AUR_PACMAN_AUTH: /bin/false

