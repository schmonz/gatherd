---
setup_dir: "/usr/local/lib/gatherd"
nfs_server: ap-juicer.taile54b91.ts.net

# Hardcoded per-user/per-machine config. Replace with a real delivery mechanism
# (extra-vars file, host_vars, Calamares-staged file, etc.) when this repo grows
# configurability; consumers reference these by name.
hardcoded_dotfiles_repo: "https://github.com/schmonz/dotfiles.git"
hardcoded_ssh_authorized_keys_dotfile: ssh-authorized-keys
# wifi_networks is defined entirely in vault — SSIDs are personal data, not just PSKs.
# Desktop wallpaper + gtklock background, fetched at provision time
# (roles/desktop/tasks/wallpaper.yml). Public images but me-specific, so the URLs
# sit with the other hardcoded_* placeholders. Two variants — same composition,
# dark-blue vs pink sky — so the wallpaper can follow the GTK light/dark scheme;
# the lock screen always uses the dark one. An empty URL skips the fetch and
# swaybg falls back to a solid color.
hardcoded_wallpaper_dark_url: "https://raw.githubusercontent.com/dharmx/walls/main/minimal/a_blue_sky_over_a_mountain_range.png"
hardcoded_wallpaper_light_url: "https://raw.githubusercontent.com/dharmx/walls/main/minimal/a_blue_and_pink_sky_over_a_mountain_range.png"
wallpaper_dir: "{{ target_home }}/.local/share/backgrounds"
wallpaper_dark_path: "{{ wallpaper_dir }}/wallpaper-dark"
wallpaper_light_path: "{{ wallpaper_dir }}/wallpaper-light"

web_apps:
  - name: ChatGPT
    url: https://chatgpt.com
    comment: LLM
    codename: ChatGPT
  - name: Lumo
    url: https://lumo.proton.me
    comment: LLM
    codename: Lumo
  - name: Grok
    url: https://grok.com
    comment: LLM
    codename: Grok
  - name: Perplexity
    url: https://www.perplexity.ai
    comment: LLM
    codename: Perplexity
  - name: Gemini
    url: https://gemini.google.com
    comment: LLM
    codename: Gemini
    # DDG returns Google's generic favicon for gemini.google.com; pin the
    # sparkle from gstatic instead.
    icon_url: https://www.gstatic.com/lamda/images/gemini_sparkle_4g_512_lt_f94943af3be039176192d.png
  - name: DeepSeek
    url: https://chat.deepseek.com
    comment: LLM
    codename: DeepSeek
    # DDG has no icon for chat.deepseek.com; the apex domain works.
    icon_url: https://icons.duckduckgo.com/ip3/deepseek.com.ico
  - name: Copilot
    url: https://copilot.microsoft.com
    comment: LLM
    codename: Copilot
    # DDG has no icon for copilot.microsoft.com; pull directly from the site.
    icon_url: https://copilot.microsoft.com/favicon.ico
  - name: Le Chat
    url: https://chat.mistral.ai
    comment: LLM
    codename: LeChat
  - name: Meta AI
    url: https://meta.ai
    comment: LLM
    codename: MetaAI
  - name: HuggingChat
    url: https://huggingface.co/chat
    comment: LLM
    codename: HuggingChat
  - name: Poe
    url: https://poe.com
    comment: LLM
    codename: Poe
