---
pia_username: "{{ vault_pia_username }}"
pia_password: "{{ vault_pia_password }}"
setup_dir: "/usr/local/lib/gatherd"
nfs_server: ap-juicer.taile54b91.ts.net

# Hardcoded placeholders for per-user/per-machine config. Replace with a real
# delivery mechanism (extra-vars file, host_vars, Calamares-staged file, etc.)
# when this repo grows configurability; the consumers reference these by name.
hardcoded_dotfiles_repo: "https://github.com/schmonz/dotfiles.git"
hardcoded_ssh_authorized_keys_dotfile: ssh-authorized-keys

web_apps:
  - name: ChatGPT
    url: https://chatgpt.com
    comment: LLM
    codename: ChatGPT
  - name: Lumo
    url: https://lumo.proton.me
    comment: LLM
    codename: Lumo
  - name: Grok
    url: https://grok.com
    comment: LLM
    codename: Grok
  - name: Perplexity
    url: https://www.perplexity.ai
    comment: LLM
    codename: Perplexity
  - name: Gemini
    url: https://gemini.google.com
    comment: LLM
    codename: Gemini
    # DDG returns Google's generic favicon for gemini.google.com; pin the
    # sparkle from gstatic instead.
    icon_url: https://www.gstatic.com/lamda/images/gemini_sparkle_4g_512_lt_f94943af3be039176192d.png
  - name: DeepSeek
    url: https://chat.deepseek.com
    comment: LLM
    codename: DeepSeek
  - name: Copilot
    url: https://copilot.microsoft.com
    comment: LLM
    codename: Copilot
  - name: Le Chat
    url: https://chat.mistral.ai
    comment: LLM
    codename: LeChat
  - name: Meta AI
    url: https://meta.ai
    comment: LLM
    codename: MetaAI
  - name: HuggingChat
    url: https://huggingface.co/chat
    comment: LLM
    codename: HuggingChat
  - name: Poe
    url: https://poe.com
    comment: LLM
    codename: Poe

wifi_networks:
  - ssid: LaPromNyack
    psk: "{{ vault_wifi_psk_lapromnyack }}"
  - ssid: PeasPlaycare
    psk: "{{ vault_wifi_psk_peasplaycare }}"
  - ssid: SchmiPhone
    psk: "{{ vault_wifi_psk_schmiphone }}"
