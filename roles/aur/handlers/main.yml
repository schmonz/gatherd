---
# Log level changes are only read at daemon start, not on SIGHUP reload.
- name: Restart autofs
  ansible.builtin.systemd:
    name: autofs
    state: restarted
  failed_when: false
  become: true
  become_user: root

- name: Index the Sea Lion typeface
  ansible.builtin.command:
    argv: [fc-cache, "{{ target_home }}/.local/share/fonts/sea-lion"]
  changed_when: true
