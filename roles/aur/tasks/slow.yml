---
- name: Grant NOPASSWD pacman for slow AUR installs
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "{{ target_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    validate: visudo -cf %s
  become: true
  become_user: root

- block: # noqa: name[missing]
    - name: Install slow AUR packages
      kewlfft.aur.aur:
        name:
          # file transfer
          - localsend-bin
          # communication
          - piavpn-bin
          - vesktop-bin
          - slack-electron
          - zoom
          - teams-for-linux-electron-bin
          # cloud sync
          - rclone
          # writing
          - dawn-writer-bin
          # AI tools
          - claude-code
          - claude-desktop-bin
          - claude-cowork-service
          # IDE manager
          - jetbrains-toolbox
        use: yay
        state: present
        extra_args: "--mflags --skippgpcheck"

    - name: Install AUR fingerprint reader driver
      # python-validity drives the Validity 138a:0097 sensor and brings in
      # open-fprintd and fprintd-clients-git (which together provide the
      # standard fprintd D-Bus interface plus pam_fprintd.so). Built in the
      # async play so a slow or failing AUR build can't block first-boot
      # desktop setup the way it does in the synchronous site.yml run.
      kewlfft.aur.aur:
        name:
          - python-validity
        use: yay
        state: present
      when: has_fingerprint_reader

    - name: Suppress PIA Quick Tour before the daemon's first start
      # PIA shows the Quick Tour while sessionCount == 0. pia-client autostarts
      # on every Sway login, so if it connects during the window between the
      # daemon's first start and a post-start fix it catches sessionCount 0 and
      # shows the tour. Writing the count before the daemon ever starts means its
      # IPC reports a suppressed state from the first moment any client connects;
      # the daemon fills the remaining settings with defaults on start. Guard
      # against JSONDecodeError in case an earlier daemon run left a partial write.
      ansible.builtin.shell: |
        python3 - <<'PYEOF'
        import json, os
        path = '/opt/piavpn/etc/settings.json'
        os.makedirs(os.path.dirname(path), exist_ok=True)
        try:
            d = json.load(open(path))
        except (FileNotFoundError, json.JSONDecodeError):
            d = {}
        if d.get('sessionCount', 0) == 0:
            d['sessionCount'] = 1
            d['successfulSessionCount'] = 1
            with open(path, 'w') as f:
                json.dump(d, f)
            print('changed')
        else:
            print('ok')
        PYEOF
      args:
        executable: /bin/bash
      register: _pia_session
      changed_when: _pia_session.stdout == 'changed'
      become: true
      become_user: root

    - name: Enable and start PIA daemon
      ansible.builtin.systemd:
        name: piavpn
        enabled: true
        state: started
      become: true
      become_user: root

    - name: Wait for piavpn IPC to be ready
      # Ensure the daemon is serving before the always block launches pia-client,
      # so the client connects to a daemon that already reports sessionCount 1.
      ansible.builtin.command: /opt/piavpn/bin/piactl get connectionstate
      register: _pia_ready
      retries: 30
      delay: 1
      until: _pia_ready.rc == 0
      changed_when: false

  always:
    - name: Launch slow-installed systray apps  # noqa: risky-shell-pipe
      # swaymsg exec runs inside the live Sway session; SWAYSOCK must be set explicitly
      # since Ansible runs outside the session. Bails silently if Sway isn't up.
      ansible.builtin.shell: |
        sock=$(ls /run/user/$(id -u)/sway-ipc.*.*.sock 2>/dev/null | head -1)
        [ -n "$sock" ] || exit 0
        XDG_RUNTIME_DIR=/run/user/$(id -u) SWAYSOCK="$sock" \
          swaymsg exec "$HOME/.local/bin/gatherd-systray localsend --hidden"
        XDG_RUNTIME_DIR=/run/user/$(id -u) SWAYSOCK="$sock" \
          swaymsg exec "$HOME/.local/bin/gatherd-systray jetbrains-toolbox --minimize"
        XDG_RUNTIME_DIR=/run/user/$(id -u) SWAYSOCK="$sock" \
          swaymsg exec "$HOME/.local/bin/gatherd-systray vesktop --start-minimized"
        XDG_RUNTIME_DIR=/run/user/$(id -u) SWAYSOCK="$sock" \
          swaymsg exec "$HOME/.local/bin/gatherd-systray /opt/piavpn/bin/pia-client --quiet"
      changed_when: false

    - name: Revoke NOPASSWD pacman after slow AUR installs
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        line: "{{ target_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
        state: absent
        validate: visudo -cf %s
      become: true
      become_user: root
