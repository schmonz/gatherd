---
- name: Grant NOPASSWD pacman for slow AUR installs
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "{{ target_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    validate: visudo -cf %s
  become: true
  become_user: root

- block: # noqa: name[missing]
    - name: Install slow AUR packages
      kewlfft.aur.aur:
        name:
          # web browsers
          - ungoogled-chromium-bin
          # file transfer
          - localsend-bin
          # communication
          - piavpn-bin
          - vesktop-bin
          - slack-electron
          - zoom
          - teams-for-linux-electron-bin
          # cloud sync
          - rclone
          # writing
          - dawn-writer-bin
          # AI tools
          - claude-code
          - claude-desktop-bin
          - claude-cowork-service
          # IDE manager
          - jetbrains-toolbox
        use: yay
        state: present
        extra_args: "--mflags --skippgpcheck"

    - name: Enable and start PIA daemon
      ansible.builtin.systemd:
        name: piavpn
        enabled: true
        state: started
      become: true
      become_user: root

    - name: Check if already logged in to PIA
      ansible.builtin.command: >
        python3 -c "
        import json, sys
        try:
            d = json.load(open('/opt/piavpn/etc/account.json'))
            sys.exit(0 if d.get('loggedIn') else 1)
        except:
            sys.exit(1)"
      register: _pia_logged_in
      changed_when: false
      failed_when: false
      become: true
      become_user: root

    - name: Log in to PIA
      # piactl login produces no parseable output; `when:` already ensures this
      # only runs when the daemon is not logged in, so if it runs, it changed.
      ansible.builtin.shell: |
        tmpfile=$(mktemp)
        chmod 600 "$tmpfile"
        printf '%s\n%s\n' '{{ pia_username }}' '{{ pia_password }}' > "$tmpfile"
        /opt/piavpn/bin/piactl login "$tmpfile"
        rm -f "$tmpfile"
      when: _pia_logged_in.rc != 0
      changed_when: true
      no_log: true

    - name: Suppress PIA Quick Tour by pre-seeding session count
      # PIA shows the Quick Tour when sessionCount == 0. Setting it to 1
      # makes firstRunFlag false without ever connecting to a VPN server.
      ansible.builtin.shell: |
        python3 - <<'PYEOF'
        import json
        path = '/opt/piavpn/etc/settings.json'
        d = json.load(open(path))
        if d.get('sessionCount', 0) == 0:
            d['sessionCount'] = 1
            d['successfulSessionCount'] = 1
            with open(path, 'w') as f:
                json.dump(d, f)
            print('changed')
        else:
            print('ok')
        PYEOF
      args:
        executable: /bin/bash
      register: _pia_session
      changed_when: _pia_session.stdout == 'changed'
      become: true
      become_user: root

    - name: Restart piavpn to load updated session count into memory
      # Must run inline (not as a handler) so the daemon is ready before
      # the always block launches pia-client via swaymsg.
      ansible.builtin.systemd: # noqa: no-handler
        name: piavpn
        state: restarted
      become: true
      become_user: root
      when: _pia_session.changed

  always:
    - name: Launch slow-installed systray apps  # noqa: risky-shell-pipe
      # swaymsg exec runs inside the live Sway session; SWAYSOCK must be set explicitly
      # since Ansible runs outside the session. Bails silently if Sway isn't up.
      ansible.builtin.shell: |
        sock=$(ls /run/user/$(id -u)/sway-ipc.*.*.sock 2>/dev/null | head -1)
        [ -n "$sock" ] || exit 0
        XDG_RUNTIME_DIR=/run/user/$(id -u) SWAYSOCK="$sock" \
          swaymsg exec "$HOME/.local/bin/gatherd-systray localsend --hidden"
        XDG_RUNTIME_DIR=/run/user/$(id -u) SWAYSOCK="$sock" \
          swaymsg exec "$HOME/.local/bin/gatherd-systray jetbrains-toolbox --minimize"
        XDG_RUNTIME_DIR=/run/user/$(id -u) SWAYSOCK="$sock" \
          swaymsg exec "$HOME/.local/bin/gatherd-systray vesktop --start-minimized"
        XDG_RUNTIME_DIR=/run/user/$(id -u) SWAYSOCK="$sock" \
          swaymsg exec "$HOME/.local/bin/gatherd-systray /opt/piavpn/bin/pia-client --quiet"
      changed_when: false

    - name: Revoke NOPASSWD pacman after slow AUR installs
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        line: "{{ target_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
        state: absent
        validate: visudo -cf %s
      become: true
      become_user: root
