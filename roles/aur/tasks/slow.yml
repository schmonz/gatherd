---
- block: # noqa: name[missing]
    - name: Build slow AUR packages into the local repository
      ansible.builtin.command: "{{ aur_sync_command }} {{ aur_slow_packages | join(' ') }}"
      environment: "{{ aur_build_environment }}"
      register: _aur_sync_slow
      changed_when: "'there is nothing to do' not in _aur_sync_slow.stderr"

    - name: Remove the superseded claude-desktop-bin
      # claude-desktop conflicts with claude-desktop-bin but does not replace it,
      # so pacman asks "Remove claude-desktop-bin? [y/N]" and --noconfirm answers
      # N, failing the whole install. Machines converged before the switch still
      # carry the old package; a fresh repave never installs it.
      community.general.pacman:
        name: claude-desktop-bin
        state: absent
      become: true
      become_user: root

    - name: Install slow AUR packages
      community.general.pacman:
        name: "{{ aur_slow_packages }}"
        state: present
        update_cache: "{{ _aur_sync_slow.changed }}"
      become: true
      become_user: root

    - name: Build programs that use AVX or newer instructions
      # claude-code is a native Node bundle that uses AVX/SSE4 instructions and
      # SIGILLs on pre-AVX CPUs (e.g. the Core 2 T60); claude-cowork-service is
      # useless without it. On those machines, SSH in from an AVX-capable box.
      ansible.builtin.command: "{{ aur_sync_command }} {{ aur_slow_avx_packages | join(' ') }}"
      environment: "{{ aur_build_environment }}"
      register: _aur_sync_avx
      changed_when: "'there is nothing to do' not in _aur_sync_avx.stderr"
      when: has_avx

    - name: Install programs that use AVX or newer instructions
      community.general.pacman:
        name: "{{ aur_slow_avx_packages }}"
        state: present
        update_cache: "{{ _aur_sync_avx.changed }}"
      when: has_avx
      become: true
      become_user: root

    - name: Install AUR fingerprint reader driver
      # python-validity drives the Validity 138a:0097 sensor and brings in
      # open-fprintd and fprintd-clients-git (which together provide the
      # standard fprintd D-Bus interface plus pam_fprintd.so). Built in the
      # async play so a slow or failing AUR build can't block first-boot
      # desktop setup.
      #
      # Built in three rounds because this is the one AUR set here with AUR
      # dependencies of its own: makepkg checks depends before it builds, and
      # with no sudoers grant nothing can install an AUR dependency mid-build.
      # So each layer of the graph is built as target_user, then installed as
      # root, before the layer above it is attempted. aurutils skips a package
      # already current in the local repo, so re-runs cost nothing.
      when: has_fingerprint_reader
      block:
        # open-fprintd asks for the virtual dbus-python, which pacman cannot
        # install by name; python-dbus is what provides it.
        - name: Install the fingerprint driver's repo-provided prerequisite
          community.general.pacman:
            name: python-dbus
            state: present
          become: true
          become_user: root

        # Named -git because that is the only fprintd-clients in the AUR; the
        # plain name open-fprintd and python-validity ask for is a provides.
        - name: Build fprintd-clients-git
          ansible.builtin.command: "{{ aur_sync_command }} fprintd-clients-git"
          environment: "{{ aur_build_environment }}"
          register: _aur_sync_fprintd_clients
          changed_when: "'there is nothing to do' not in _aur_sync_fprintd_clients.stderr"

        - name: Install fprintd-clients-git
          community.general.pacman:
            name: fprintd-clients-git
            state: present
            update_cache: "{{ _aur_sync_fprintd_clients.changed }}"
          become: true
          become_user: root

        - name: Build open-fprintd
          ansible.builtin.command: "{{ aur_sync_command }} open-fprintd"
          environment: "{{ aur_build_environment }}"
          register: _aur_sync_open_fprintd
          changed_when: "'there is nothing to do' not in _aur_sync_open_fprintd.stderr"

        - name: Install open-fprintd
          community.general.pacman:
            name: open-fprintd
            state: present
            update_cache: "{{ _aur_sync_open_fprintd.changed }}"
          become: true
          become_user: root

        - name: Build python-validity
          ansible.builtin.command: "{{ aur_sync_command }} python-validity"
          environment: "{{ aur_build_environment }}"
          register: _aur_sync_python_validity
          changed_when: "'there is nothing to do' not in _aur_sync_python_validity.stderr"

        - name: Install python-validity
          community.general.pacman:
            name: python-validity
            state: present
            update_cache: "{{ _aur_sync_python_validity.changed }}"
          become: true
          become_user: root

    - name: Suppress the PIA Quick Tour and What's New dialog on first launch
      # The Quick Tour is a *client* decision, not the daemon's. pia-client shows it
      # when ClientState.firstRunFlag is set, which happens when ClientSettings
      # .lastUsedVersion is empty at startup. That value lives in the per-user
      # ~/.config/privateinternetaccess/clientsettings.json, NOT the daemon's
      # /opt/piavpn/etc/settings.json. Seed it before pia-client first launches (the
      # always block below) so a fresh repave skips onboarding. Use the *exact*
      # installed version: an empty value triggers the Tour, a non-empty-but-mismatched
      # one triggers the separate "What's New" dialog, so only the exact version
      # suppresses both. Runs as target_user (the file must be user-owned). Guard against
      # JSONDecodeError in case a prior client run left a partial write.
      ansible.builtin.shell: |
        ver=$(/opt/piavpn/bin/piactl --version)
        python3 - "$ver" <<'PYEOF'
        import json, os, sys
        ver = sys.argv[1].strip()
        path = '{{ target_home }}/.config/privateinternetaccess/clientsettings.json'
        os.makedirs(os.path.dirname(path), exist_ok=True)
        try:
            d = json.load(open(path))
        except (FileNotFoundError, json.JSONDecodeError):
            d = {}
        if d.get('lastUsedVersion') != ver:
            d['lastUsedVersion'] = ver
            with open(path, 'w') as f:
                json.dump(d, f, indent=2)
            print('changed')
        else:
            print('ok')
        PYEOF
      args:
        executable: /bin/bash
      register: _pia_tour
      changed_when: _pia_tour.stdout == 'changed'

    - name: Enable and start PIA daemon
      ansible.builtin.systemd:
        name: piavpn
        enabled: true
        state: started
      become: true
      become_user: root

    - name: Wait for piavpn IPC to be ready
      # Ensure the daemon is serving before the always block launches pia-client,
      # so the client connects to a daemon that already reports sessionCount 1.
      ansible.builtin.command: /opt/piavpn/bin/piactl get connectionstate
      register: _pia_ready
      retries: 30
      delay: 1
      until: _pia_ready.rc == 0
      changed_when: false

  always:
    - name: Launch slow-installed systray apps  # noqa: risky-shell-pipe
      # swaymsg exec runs inside the live Sway session; SWAYSOCK must be set explicitly
      # since Ansible runs outside the session. Bails silently if Sway isn't up.
      ansible.builtin.shell: |
        sock=$(ls /run/user/$(id -u)/sway-ipc.*.*.sock 2>/dev/null | head -1)
        [ -n "$sock" ] || exit 0
        XDG_RUNTIME_DIR=/run/user/$(id -u) SWAYSOCK="$sock" \
          swaymsg exec "$HOME/.local/bin/gatherd-systray localsend --hidden"
        XDG_RUNTIME_DIR=/run/user/$(id -u) SWAYSOCK="$sock" \
          swaymsg exec "$HOME/.local/bin/gatherd-systray /opt/piavpn/bin/pia-client --quiet"
      changed_when: false
