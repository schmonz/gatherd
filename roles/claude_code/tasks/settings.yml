---
- name: Ensure the Claude Code config directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.claude"
    state: directory
    mode: '0755'

- name: Read any existing Claude Code settings
  # failed_when: false so a fresh machine with no settings.json yet is not an
  # error — the merge below treats a missing file as an empty object.
  ansible.builtin.slurp:
    src: "{{ target_home }}/.claude/settings.json"
  register: claude_settings_existing
  failed_when: false
  changed_when: false

- name: Merge gatherd's Claude Code defaults into settings.json
  # Merge ONLY these keys; combine(recursive=true) preserves every other
  # setting (model, theme, ...) the user maintains by hand. to_nice_json sorts
  # keys, so the first run may reorder an existing file — stable and idempotent
  # thereafter.
  #
  # EXCEPT hooks.PreToolUse: combine(recursive=true) REPLACES lists rather than
  # appending, so gatherd owns that one event outright and a hand-added
  # PreToolUse entry would be overwritten on the next converge. Other events
  # (PostToolUse, Stop, ...) are untouched. Add PreToolUse hooks to doubt.yml,
  # not to settings.json by hand.
  ansible.builtin.copy:
    dest: "{{ target_home }}/.claude/settings.json"
    content: "{{ current | combine(required, recursive=true) | to_nice_json(indent=2) }}\n"
    mode: '0644'
  vars:
    current: >-
      {{ (claude_settings_existing.content | b64decode | from_json)
         if claude_settings_existing.content is defined else {} }}
    # Built as a single Jinja dict expression, not a YAML literal mapping, so
    # any templated key actually expands; templated keys in a plain YAML `vars:`
    # mapping are left as literal "{{ ... }}" strings. The marketplace and
    # plugin data now lives in group_vars already shaped as settings.json wants
    # it, so adding a plugin is a data change, not a template change.
    #
    # disableClaudeAiConnectors turns off the claude.ai account's auto-connected
    # MCP connectors (Gmail, Google Calendar, Google Drive, and any future ones),
    # which arrive unauthenticated. One global switch; the per-project
    # disabledMcpServers toggle does not cover projects that don't exist yet.
    required: >-
      {{ {
           'disableClaudeAiConnectors': true,
           'outputStyle': 'Concise',
           'extraKnownMarketplaces': claude_marketplaces,
           'enabledPlugins': dict(claude_enabled_plugins
                                  | zip([true] * (claude_enabled_plugins | length))),
           'hooks': {
             'PreToolUse': [
               {'matcher': 'Bash',
                'hooks': [{'type': 'command',
                           'command': target_home ~ '/.local/bin/gatherd-doubt-commit-hook'}]},
               {'matcher': 'Write|Edit',
                'hooks': [{'type': 'command',
                           'command': target_home ~ '/.local/bin/gatherd-doubt-doc-hook'}]}
             ]
           }
         } }}

- name: Set whether the ADHD ruleset loads in every session
  # i-have-adhd ships a SessionStart hook that loads its full ruleset when this
  # flag exists, so /i-have-adhd need not be typed. It is a per-user marker
  # file rather than a settings.json key, which is why it is its own task.
  #
  # preserve on both timestamps: a bare `touch` reports changed on every
  # converge, and a task that is never green is one nobody reads.
  ansible.builtin.file:
    path: "{{ target_home }}/.claude/.i-have-adhd-always"
    state: "{{ 'touch' if claude_adhd_always_on else 'absent' }}"
    mode: '0644'
    modification_time: preserve
    access_time: preserve
