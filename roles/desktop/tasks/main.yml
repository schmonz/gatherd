---
- name: Create required config directories
  ansible.builtin.file:
    path: "{{ target_home }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - .local/bin
    - .config/arch-update
    - .config/netsurf
    - .config/systemd/user/timers.target.wants
    - .config/gtklock
    - .config/sway/config.d
    - .config/sway/scripts
    - .local/share/applications/kde4
    - .config/net.imput.helium/Default
    - .config/chromium/Default
    - .config/vesktop
    - .local/share/org.localsend.localsend_app
    - .cache/captive-browser/Default
    - .config/xdg-desktop-portal

- name: Enable system dark mode
  # Without this, the default ('default') leaves GTK, Flutter, and other apps guessing.
  # dbus-run-session creates a throwaway bus; no user session needed.
  ansible.builtin.shell: |
    cur=$(dbus-run-session gsettings get org.gnome.desktop.interface color-scheme 2>/dev/null)
    [ "$cur" = "'prefer-dark'" ] || {
      dbus-run-session gsettings set org.gnome.desktop.interface color-scheme prefer-dark
      echo changed
    }
  register: _darkmode
  changed_when: "'changed' in _darkmode.stdout"

# gatherd-askpass now lives only at /usr/local/bin (installed by the system role,
# referenced by sudo.conf, SUDO_ASKPASS, and SSH_ASKPASS). Drop the old per-user
# copy so there is a single source of truth.
- name: Remove obsolete per-user gatherd-askpass
  ansible.builtin.file:
    path: "{{ target_home }}/.local/bin/gatherd-askpass"
    state: absent

- name: Remove obsolete environment.d askpass file
  ansible.builtin.file:
    path: "{{ target_home }}/.config/environment.d/50-gatherd-askpass.conf"
    state: absent

- name: Remove obsolete environment.d sentinel file
  ansible.builtin.file:
    path: "{{ target_home }}/.config/environment.d/99-gatherd-env-sentinel.conf"
    state: absent

- name: Configure XDG desktop portal backend routing
  # Route Settings to gtk (for Qt color-scheme) and everything else to wlr.
  # This keeps geolocation off (neither wlr nor gtk handle Location by default
  # when wlr is the default backend) while enabling the Settings portal.
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/xdg-desktop-portal/portals.conf"
    content: |
      [preferred]
      default=wlr
      Settings=gtk
    mode: '0644'

- name: Plant a passwordless login keyring
  ansible.builtin.import_tasks: keyring.yml

- name: Configure gtklock (no unauthenticated power buttons)
  ansible.builtin.template:
    src: gtklock-config.ini.j2
    dest: "{{ target_home }}/.config/gtklock/config.ini"
    mode: '0644'

- name: Configure desktop wallpaper and lock-screen background
  ansible.builtin.import_tasks: wallpaper.yml

- name: Remove stock swayidle entries superseded by our configuration
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/autostart_applications"
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^exec swayidle idlehint'
    - '^exec_always swayidle -w before-sleep'

- name: Configure swayidle
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.config/sway/config.d/autostart_applications"
    block: "{{ lookup('template', 'swayidle-exec.j2') }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: swayidle"

# Replace EndeavourOS's polkit-gnome (its own GTK dialog) with our cmd-polkit
# agent, so polkit password prompts come up in fuzzel like sudo/ssh/vault.
- name: Point the polkit agent autostart at gatherd-polkit-agent
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/autostart_applications"
    regexp: '^exec .*polkit-gnome-authentication-agent'
    line: "exec {{ target_home }}/.local/bin/gatherd-polkit-agent"

- name: Fix the polkit autostart comment
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/autostart_applications"
    regexp: '^# Auth with polkit'
    line: "# Auth with polkit (fuzzel via gatherd-polkit-agent):"

- name: Add XF86PowerOff binding to sway config
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/default"
    line: "bindsym XF86PowerOff exec $powermenu"
    regexp: '^\s*bindsym\s+XF86PowerOff\b'

- name: Disable numlock in sway
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/input"
    line: "input type:keyboard xkb_numlock disabled"
    regexp: '^\s*input\s+type:keyboard\s+xkb_numlock\b'
  when: has_embedded_numpad

- name: Configure TrackPoint middle-button scroll in sway
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.config/sway/config.d/input"
    block: |
      input type:pointer {
          scroll_method on_button_down
          scroll_button button2
      }
    marker: "# {mark} ANSIBLE MANAGED BLOCK: trackpoint-scroll"
  when: has_thinkpad_trackpoint

# Unconditional on purpose: a bindsym for a keysym no device emits is inert,
# so there's nothing to detect. The blue ThinkVantage button (T60-era and
# earlier ThinkPads) emits KEY_PROG1 = XF86Launch1; machines without it simply
# never fire this. To wire up *other* extra buttons on some future machine,
# first discover what they emit, then add a bindsym here:
#   1. See the superset a device *can* emit (includes codes the chassis lacks):
#      decode each /sys/class/input/input*/capabilities/key bitmap (64-bit hex
#      words, high codes first) against /usr/include/linux/input-event-codes.h.
#   2. Confirm the *physical* button -> code mapping by pressing it — capability
#      alone lies (that device advertises KEY_VENDOR, but the button sends
#      KEY_PROG1): sudo evtest /dev/input/eventN  (or libinput debug-events / wev).
#   3. Map the evdev code to its X keysym for the bindsym. Note: codes > 247 are
#      outside xkb's range and can't be bound by keysym — those need a udev/hwdb
#      scancode remap to a low code first.
- name: Bind ThinkVantage button to open terminal
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/default"
    line: "bindsym XF86Launch1 exec foot"
    regexp: '^\s*bindsym\s+XF86Launch1\b'

- name: Remove network throughput widget from waybar center
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/waybar/config"
    regexp: '^\s+"network"\s*,?\s*$'
    state: absent

- name: Add mpris widget to waybar modules-right
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/waybar/config"
    insertafter: '"backlight",'
    line: '        "mpris",'
    regexp: '"mpris"'

- name: Add mpris widget config to waybar
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.config/waybar/config"
    insertbefore: '"network":'
    marker: "// {mark} ANSIBLE MANAGED BLOCK: mpris"
    block: |2
          "mpris": {
              "format": "{player_icon} {title} — {artist}",
              "format-paused": "{status_icon} {title} — {artist}",
              "player-icons": { "default": "▶" },
              "status-icons": { "paused": "⏸" },
              "max-length": 40
          },

- name: Add mpris to waybar CSS module list
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/waybar/style.css"
    insertafter: '#backlight,'
    regexp: '#mpris,'
    line: '#mpris,'

- name: Add mpris min-width to waybar CSS
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.config/waybar/style.css"
    insertbefore: '^#pulseaudio \{'
    marker: "/* {mark} ANSIBLE MANAGED BLOCK: mpris */"
    block: |
      #mpris {
          min-width: 8em;
      }

- name: Configure waybar to use btop
  ansible.builtin.replace:
    path: "{{ target_home }}/.config/waybar/config"
    regexp: '\bhtop\b'
    replace: btop

- name: Configure waybar bar font size
  ansible.builtin.replace:
    path: "{{ target_home }}/.config/waybar/style.css"
    after: '#waybar\s*\{'
    before: '\}'
    regexp: 'font-size:\s*\d+px'
    replace: "font-size: {{ (13 * foot_font_size / 10) | round | int }}px"

- name: Configure waybar workspaces font size
  ansible.builtin.replace:
    path: "{{ target_home }}/.config/waybar/style.css"
    after: '#workspaces\s*\{'
    before: '\}'
    regexp: 'font-size:\s*\d+px'
    replace: "font-size: {{ (13 * foot_font_size / 10) | round | int }}px"

- name: Configure waybar power button font size
  ansible.builtin.replace:
    path: "{{ target_home }}/.config/waybar/style.css"
    after: '#custom-power\s*\{'
    before: '\}'
    regexp: 'font-size:\s*\d+px'
    replace: "font-size: {{ (16 * foot_font_size / 10) | round | int }}px"

- name: Configure waybar tray icon size
  ansible.builtin.replace:
    path: "{{ target_home }}/.config/waybar/config"
    after: '"tray"\s*:\s*\{'
    before: '\}'
    regexp: '"icon-size":\s*\d+'
    replace: '"icon-size": {{ (16 * foot_font_size / 10) | round | int }}'

- name: Configure Sway output scale for HiDPI panel
  # output * applies to all connected outputs; on a laptop this is the internal
  # panel. Users with external monitors at a different DPI should add a more
  # specific override (e.g. output HDMI-1 scale 1) in config.d/outputs.
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/outputs"
    create: true
    mode: '0644'
    line: "output * scale 2"
    regexp: '^\s*output\s+\*\s+scale\b'
  when: has_hidpi_display

- name: Configure foot font size for 80-col two-up layout
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/foot/foot.ini"
    regexp: '^font='
    line: "font=JetBrainsMono-Regular:size={{ foot_font_size }}"

- name: Configure xed font size for 80-col two-up layout
  ansible.builtin.shell: |
    font="JetBrains Mono {{ foot_font_size }}"
    cur=$(dbus-run-session gsettings get org.x.editor.preferences.editor editor-font 2>/dev/null)
    use=$(dbus-run-session gsettings get org.x.editor.preferences.editor use-default-font 2>/dev/null)
    if [ "$cur" = "'$font'" ] && [ "$use" = "false" ]; then
      echo ok
    else
      dbus-run-session gsettings set org.x.editor.preferences.editor use-default-font false
      dbus-run-session gsettings set org.x.editor.preferences.editor editor-font "$font"
      echo changed
    fi
  register: _xed_font
  changed_when: _xed_font.stdout == 'changed'

- name: Configure system monospace font
  # Sets the default monospace font for apps that don't have explicit font config
  # (e.g. gnome-text-editor). xed has its own explicit setting below.
  ansible.builtin.shell: |
    font="JetBrains Mono {{ foot_font_size }}"
    cur=$(dbus-run-session gsettings get org.gnome.desktop.interface monospace-font-name 2>/dev/null)
    [ "$cur" = "'$font'" ] || {
      dbus-run-session gsettings set org.gnome.desktop.interface monospace-font-name "$font"
      echo changed
    }
  register: _monospace_font
  changed_when: "'changed' in _monospace_font.stdout"

- name: Reset GTK text scaling factor to 1.0
  # text-scaling-factor used to be set proportionally to foot_font_size, but that
  # double-scales any GTK app with an explicit font setting (xed, Text Editor).
  # All apps needing foot_font_size are now configured explicitly or via
  # monospace-font-name above; text-scaling-factor must stay at 1.0.
  ansible.builtin.command:
    cmd: "dbus-run-session gsettings set org.gnome.desktop.interface text-scaling-factor 1.0"
  changed_when: false

- name: Configure Sway window title font size
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/theme"
    regexp: '^font pango:'
    line: "font pango:Noto Sans Regular {{ foot_font_size }}"

- name: Configure mako notification font size
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/mako/config"
    regexp: '^font='
    line: "font=UbuntuMono {{ (12.5 * foot_font_size / 10) | round(1) }}"

- name: Configure fuzzel font size
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/fuzzel/fuzzel.ini"
    regexp: '^font='
    line: "font=JetBrainsMono-Regular:size={{ foot_font_size }}"

- name: Fix fuzzel icon theme case
  # EndeavourOS ships Qogir-Dark but fuzzel.ini defaults to Qogir-dark (lowercase
  # d), so fuzzel silently falls back to hicolor and misses icons in the theme.
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/fuzzel/fuzzel.ini"
    regexp: '^#?\s*icon-theme='
    line: "icon-theme=Qogir-Dark"

- name: Enable fuzzel keyword search
  # Default fields (filename,name,generic) omit keywords, so apps are only
  # findable by their packaged name — e.g. searching "discord" misses vesktop.
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/fuzzel/fuzzel.ini"
    regexp: '^#?\s*fields='
    line: "fields=filename,name,generic,keywords"

- name: Enable foot browser launch
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/foot/foot.ini"
    regexp: '^#?\s*launch=xdg-open \$\{url\}$'
    line: "launch=xdg-open ${url}"

- name: Configure NetSurf preferences
  # NetSurf rewrites Choices wholesale on exit, so seed only the keys we care
  # about per-line rather than templating the file — that way neither a playbook
  # re-run nor NetSurf itself clobbers prefs added later. search_provider:18 is
  # DuckDuckGo on this build's SearchEngines list; search_url_bar:1 searches from
  # the URL bar; button_type:1 is small toolbar icons. (A "prefer dark mode"
  # option exists only post-3.11 upstream — absent from the installed
  # netsurf-gtk3 3.11 — so it is intentionally not set here yet.)
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/netsurf/Choices"
    regexp: "^{{ item.opt }}:"
    line: "{{ item.opt }}:{{ item.val }}"
    create: true
    mode: '0644'
  loop:
    - { opt: search_provider, val: 18 }
    - { opt: search_url_bar, val: 1 }
    - { opt: button_type, val: 1 }
  loop_control:
    label: "{{ item.opt }}"

- name: Replace sway default browser with xdg-open
  ansible.builtin.replace:
    path: "{{ target_home }}/.config/sway/config.d/default"
    regexp: 'exec firefox'
    replace: "exec xdg-open https://"

- name: Disable EOS greeter
  community.general.ini_file:
    path: "{{ target_home }}/.config/EOS-greeter.conf"
    section: null
    option: Greeter
    value: disable
    no_extra_spaces: true
    create: true
    mode: '0644'

- name: Set default browser via mimeapps
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/mimeapps.list"
    content: |
      [Default Applications]
      x-scheme-handler/http=helium.desktop
      x-scheme-handler/https=helium.desktop
      text/html=helium.desktop
      application/xhtml+xml=helium.desktop
      text/plain=org.x.editor.desktop
      text/markdown=org.x.editor.desktop
      text/x-markdown=org.x.editor.desktop
    mode: '0644'

- name: Configure browser preferences
  ansible.builtin.copy:
    dest: "{{ target_home }}/{{ item.dest }}"
    content: "{{ item.content }}\n"
    force: "{{ item.force | default(true) }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - dest: .config/net.imput.helium/initial_preferences
      content: '{"browser":{"check_default_browser":false},"extensions":{"theme":{"system_theme":1}},"helium":{"completed_onboarding":true,"services":{"schema_version":1,"user_consented":true}},"session":{"restore_on_startup":1}}'
    - dest: .config/chromium/initial_preferences
      content: '{"browser":{"check_default_browser":false},"distribution":{"skip_first_run_ui":true,"suppress_first_run_bubble":true,"show_welcome_page":false},"session":{"restore_on_startup":1}}'
    - dest: .config/helium-browser-flags.conf
      content: "--password-store=basic"
    - dest: .config/chromium-flags.conf
      content: "--password-store=basic"

- name: Seed Helium UI preferences on a fresh profile
  # system_theme 2 = Qt; dark mode follows color-scheme prefer-dark via the XDG
  # settings portal (QT_QPA_PLATFORMTHEME=xdgdesktopportal + xdg-desktop-portal-gtk
  # providing the Settings interface). custom_chrome_frame false = system title
  # bar/borders; helium.browser layout 0 = normal (not compact), zen_mode off,
  # no rounded web-content frame; restore_on_startup 1 = continue where you left off
  # (Chromium enum: 1=last session, 4=specific URLs, 5=New Tab page).
  # These keys must live in Default/Preferences: Chromium's initial_preferences
  # only honors a fixed whitelist and drops them. force:false so an established
  # profile (the user's own later tweaks) is never clobbered; the Default/ dir
  # is pre-created above.
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/net.imput.helium/Default/Preferences"
    content: '{"browser":{"custom_chrome_frame":false},"extensions":{"theme":{"system_theme":2}},"helium":{"browser":{"layout":0,"rounded_frame":false,"zen_mode":false}},"session":{"restore_on_startup":1}}'
    force: false
    mode: '0600'

- name: Seed Helium Memory Saver to Maximum on low-RAM machines
  # Stored in Local State (not Default/Preferences); aggressiveness 2 = Maximum.
  # force: false so Helium's live Local State is never clobbered on re-runs.
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/net.imput.helium/Local State"
    content: "{\"performance_tuning\":{\"high_efficiency_mode\":{\"aggressiveness\":2}}}\n"
    force: false
    mode: '0600'
  when: not has_plenty_of_ram


- name: Configure LocalSend preferences
  # Merges only our keys, preserving any existing keys (certs, session data, etc.)
  ansible.builtin.shell: |
    python3 - <<'PYEOF'
    import json, os
    path = "{{ target_home }}/.local/share/org.localsend.localsend_app/shared_preferences.json"
    try:
        with open(path) as f:
            d = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        d = {}
    want = {
        "flutter.ls_alias": "{{ lookup('pipe', 'hostname -s') }}",
        "flutter.ls_color": "system",
        "flutter.ls_minimize_to_tray": True,
    }
    if all(d.get(k) == v for k, v in want.items()):
        print("ok")
    else:
        d.update(want)
        with open(path, 'w') as f:
            json.dump(d, f)
        os.chmod(path, 0o600)
        print("changed")
    PYEOF
  args:
    executable: /bin/bash
  register: _localsend_prefs
  changed_when: _localsend_prefs.stdout == 'changed'

- name: Configure conky to display hostname on desktop
  ansible.builtin.copy:
    dest: "{{ target_home }}/.conkyrc"
    mode: '0644'
    content: |
      conky.config = {
          out_to_wayland = true,
          out_to_x = false,
          alignment = 'bottom_right',
          gap_x = 20,
          -- bottom margin in foot-heights: 2 (≈two lines of base) + 2.5 to clear a terminal's tmux status bar
          gap_y = {{ ((foot_font_size | int) * 2 + (foot_font_size | int) * 2.5) | round | int }},

          own_window = true,
          own_window_type = 'desktop',
          own_window_transparent = true,

          font = 'Noto Sans:bold:size={{ (foot_font_size | int * 16 / 14) | round | int }}',
          default_color = 'white',
          draw_shades = true,

          update_interval = 3600,
          double_buffer = true,
      };

      conky.text = [[${alignr}${exec {{ target_home }}/.local/bin/gatherd-describe-machine}
      ${alignr}${font Noto Sans:bold:size={{ (foot_font_size | int * 32 / 14) | round | int }}}${nodename}]];

- name: Configure arch-update
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/arch-update/arch-update.conf"
    content: |
      AURHelper=yay
      NoFlatpak
    mode: '0644'

- name: Configure xdg-terminal-exec to use foot
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/xdg-terminals.list"
    content: "foot.desktop\n"
    mode: '0644'

- name: Enable arch-update timer
  # systemd-specific; will need a different mechanism on Artix/s6
  ansible.builtin.file:
    path: "{{ target_home }}/.config/systemd/user/timers.target.wants/arch-update.timer"
    src: /usr/lib/systemd/user/arch-update.timer
    state: link

- name: Configure captive-browser to use Ungoogled Chromium
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/captive-browser.toml"
    mode: '0644'
    content: |
      browser = """
      helium-browser \
        --class=captive-browser \
        --user-data-dir="$HOME/.cache/captive-browser" \
        --proxy-server="socks5://$PROXY" \
        --no-first-run \
        --no-default-browser-check \
        --disable-extensions \
        --disable-background-networking \
        --disable-component-update \
        --disable-sync \
        --disable-features=DnsOverHttps,HttpsUpgrades,HttpsFirstBalancedMode,HttpsFirstModeV2,HttpsFirstModeIncognito \
        http://whatsmyip.schmonz.com
      """

      dhcp-dns = "nmcli -g IP4.DNS dev show $(nmcli -t -f DEVICE,TYPE,STATE dev | awk -F: '/wifi:connected/{print $1; exit}') | cut -d, -f1"

      socks5-addr = "localhost:1666"

- name: Pre-seed captive-browser profile to skip first-run and HTTPS-First interstitial
  # captive-browser uses its own helium profile (.cache/captive-browser), separate
  # from the pre-seeded main one. Left unconfigured it did slow first-run/services
  # work behind the portal and showed an HTTPS-First "site is not secure"
  # interstitial on the HTTP portal URL. force: false so helium owns the file after.
  ansible.builtin.copy:
    dest: "{{ target_home }}/.cache/captive-browser/Default/Preferences"
    content: '{"browser":{"check_default_browser":false},"helium":{"completed_onboarding":true,"services":{"schema_version":1,"user_consented":true}},"https_only_mode_enabled":false}'
    force: false
    mode: '0600'

- name: Install gatherd-systray script
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/gatherd-systray"
    dest: "{{ target_home }}/.local/bin/gatherd-systray"
    mode: '0755'
    remote_src: true

- name: Install gatherd-session-helpers supervisor script
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/gatherd-session-helpers"
    dest: "{{ target_home }}/.local/bin/gatherd-session-helpers"
    mode: '0755'
    remote_src: true

- name: Install gatherd-polkit-agent (fuzzel polkit prompts)
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/gatherd-polkit-agent"
    dest: "{{ target_home }}/.local/bin/gatherd-polkit-agent"
    mode: '0755'
    remote_src: true

- name: Install gatherd-session-leftovers diagnostic script
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/gatherd-session-leftovers"
    dest: "{{ target_home }}/.local/bin/gatherd-session-leftovers"
    mode: '0755'
    remote_src: true

- name: Install gatherd-conky wrapper script
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/gatherd-conky"
    dest: "{{ target_home }}/.local/bin/gatherd-conky"
    mode: '0755'
    remote_src: true

- name: Install gatherd-intercept-localsend-flash script
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/gatherd-intercept-localsend-flash"
    dest: "{{ target_home }}/.local/bin/gatherd-intercept-localsend-flash"
    mode: '0755'
    remote_src: true

- name: Install gatherd-prompt-captiveportal script
