    state: directory
    mode: '0755'
  loop:
    - icons
    - profiles

- name: Download and convert web app favicon to PNG
  # Default source is DuckDuckGo's icon service: one URL pattern, sidesteps
  # per-site bot blocking (Cloudflare on chatgpt.com etc.). Per-entry icon_url
  # overrides when DDG returns the wrong icon (e.g. Gemini's generic Google
  # favicon vs the sparkle). Pillow stays in the pipeline because either source
  # can return ICO. A single failure must not abort site.yml — that would skip
  # the gatherd-prompt-* installs and autostart entries later in this role.
  # Missing icons fall back to fuzzel's generic glyph; the verify step catches
  # stragglers.
  ansible.builtin.shell: |
    set -eu
    tmp=$(mktemp)
    trap 'rm -f "$tmp"' EXIT
    curl -fsSL --max-time 10 -o "$tmp" '{{ item.icon_url | default("https://icons.duckduckgo.com/ip3/" + (item.url | urlsplit("hostname")) + ".ico") }}'
    python3 -c '
    from PIL import Image
    import sys
    Image.open(sys.argv[1]).save(sys.argv[2])
    ' "$tmp" '{{ target_home }}/.local/share/ice/icons/{{ item.codename }}.png'
  args:
    creates: "{{ target_home }}/.local/share/ice/icons/{{ item.codename }}.png"
  loop: "{{ web_apps }}"
  register: _favicon_dl
  changed_when: _favicon_dl.rc == 0
  failed_when: false

- name: Report web app favicons that could not be fetched or converted
  ansible.builtin.debug:
    msg: "Favicon failed for {{ item.item.codename }}: {{ item.stderr | default('skipped') | trim }}"
  loop: "{{ _favicon_dl.results }}"
  loop_control:
    label: "{{ item.item.codename | default('?') }}"
  when:
    - item.rc is defined
    - item.rc != 0

- name: Create web app Chromium profile directory
  ansible.builtin.file:
