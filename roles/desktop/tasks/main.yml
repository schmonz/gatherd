- name: Fix missing fuzzel icons
  # Scans all .desktop entries and remediates known gap patterns: XPM-only icons
  # in pixmaps (converted to PNG), SVGs filed under non-apps theme contexts
  # (copied to hicolor/scalable/apps), and Icon= names with non-standard
  # extensions (local .desktop override with the bare name). Idempotent.
  ansible.builtin.script:
    cmd: "{{ setup_dir }}/scripts/gatherd-fix-fuzzel-icons"
  register: _fuzzel_icons
  changed_when: "'changed' in _fuzzel_icons.stdout"

- name: Remove sway-install.sh stray gparted desktop entry
  ansible.builtin.file:
    path: "{{ target_home }}/.local/share/applications/gparted.desktop"
    state: absent

- name: Remove obsolete gnome-keyring --unlock autostart lines
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/autostart_applications"
    regexp: 'gnome-keyring-daemon --unlock'
    state: absent

- name: Remove obsolete systray autostart entries
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/autostart_applications"
    regexp: "^exec (?:.*/)?{{ item }}$"
    state: absent
  loop:
    - gatherd-launch-systray
    - gatherd-systray-1password
    - gatherd-systray-localsend
    - gatherd-systray-tailscale
    - gatherd-systray-updater
    - gatherd-systray-jetbrains
    - gatherd-wait-sni

- name: Add show-slow-progress autostart
  # The script gates and opens its own terminal only when an install is actually
  # in progress, so it must NOT be wrapped in a terminal here — that's what made
  # it flash a window on logins after async had finished.
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/autostart_applications"
    regexp: "^exec .*gatherd-show-slow-progress"
    line: "exec {{ target_home }}/.local/bin/gatherd-show-slow-progress"

- name: Remove per-helper autostart entries now launched by the session supervisor
  # gatherd-session-helpers launches conky, the gatherd-prompt-* watchers, and the
  # gatherd-systray apps as its own children so it can tear the whole cohort down
  # when sway exits (see scripts/gatherd-session-helpers). Drop their standalone
  # `exec` lines so sway doesn't also launch them directly — that would double them
  # and re-leak the duplicates on logout, which is the bug we're fixing.
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/autostart_applications"
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^exec conky$'
    - '^exec (?:.*/)?gatherd-prompt-(captiveportal|1password|tailscale|postsetup|vault|pia)$'
    - '^exec .*gatherd-systray '

- name: Add the session-helper supervisor autostart entry
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/autostart_applications"
    regexp: "^exec .*gatherd-session-helpers$"
    line: "exec {{ target_home }}/.local/bin/gatherd-session-helpers"
