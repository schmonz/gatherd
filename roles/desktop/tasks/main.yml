- name: Float the ssh host-key verification prompt
  # gatherd-askpass opens this foot window (app_id set to match) for the SSH
  # first-contact yes/no prompt; floating keeps the modal decision centered
  # instead of tiling it into a random split.
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/application_defaults"
    line: 'for_window [app_id="gatherd-hostkey-verify"] floating enable'

- name: Preserve keyhint popup font sizes despite GTK text-scaling-factor
  # GDK_DPI_SCALE=1/text-scaling-factor cancels the gsettings scaling exactly,
  # so the hardcoded Pango sizes render at their intended size while all other
  # settings (theme, dark mode) are still read from the regular dconf backend.
  ansible.builtin.replace:
    path: "{{ target_home }}/.config/waybar/scripts/keyhint.sh"
    regexp: '^yad "\$\{cheat\[@\]\}"'
    replace: |
      _ts=$(gsettings get org.gnome.desktop.interface text-scaling-factor 2>/dev/null || echo 1)
      GDK_DPI_SCALE=$(awk "BEGIN{printf \"%.4f\", 1.0/$_ts}") yad "${cheat[@]}"

- name: Pre-seed Vesktop first-run state to skip setup screen
  # Vesktop shows a setup screen when state.json has no firstLaunch key.
  # force: false so Vesktop can update the file freely after first run.
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/vesktop/state.json"
    content: '{"firstLaunch":false}'
    mode: '0600'
    force: false

- name: Pre-seed Vesktop initial settings
  # Sets the choices the setup screen would otherwise ask for.
  # force: false so Vesktop can update freely after first run.
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/vesktop/settings.json"
    content: '{"discordBranch":"stable","minimizeToTray":true,"arRPC":false}'
    mode: '0600'
    force: false

- name: Create JetBrains Toolbox data directory
  ansible.builtin.file:
    path: "{{ target_home }}/.local/share/JetBrains/Toolbox"
    state: directory
    mode: '0755'

- name: Pre-seed JetBrains Toolbox storage to skip onboarding
  # technicalOnboardingFinished suppresses the onboarding window that overrides --minimize.
  # force: false lets Toolbox update the file freely after first run.
  ansible.builtin.copy:
    dest: "{{ target_home }}/.local/share/JetBrains/Toolbox/.storage.json"
    content: |
      {
          "firstRunDate": "2020-01-01T00:00:00.000+00:00",
          "onboarding": {
              "currentTechnicalStep": 0,
              "version": 1,
              "technicalOnboardingFinished": true,
              "isEnterpriseBlockedScreen": false
          }
      }
    mode: '0600'
    force: false

- name: Create JetBrains Java preferences directory for EUA acceptance
  # Toolbox records EUA acceptance in Java Preferences, not in .storage.json
  # (acceptedLicenseAgreementHashes stays empty even after accepting). The
  # node name is Toolbox-internal and gets encoded by java.util.prefs via
  # Base64.byteArrayToAltBase64 — deterministic for a given Toolbox build,
  # so the encoded directory name below is stable as long as the AUR package
  # version doesn't change. If Toolbox prompts for the EUA again after an
  # upgrade, accept once and re-capture this path + prefs.xml.
  ansible.builtin.file:
    path: "{{ target_home }}/.java/.userPrefs/jetbrains/_!(!!cg\"p!(}!}@\"j!(k!|w\"w!'8!b!\"p!':!e@=="
    state: directory
    mode: '0755'

- name: Pre-seed JetBrains EUA acceptance in Java Preferences
  ansible.builtin.copy:
    dest: "{{ target_home }}/.java/.userPrefs/jetbrains/_!(!!cg\"p!(}!}@\"j!(k!|w\"w!'8!b!\"p!':!e@==/prefs.xml"
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="no"?>
      <!DOCTYPE map SYSTEM "http://java.sun.com/dtd/preferences.dtd">
      <map MAP_XML_VERSION="1.0">
        <entry key="eua_accepted_version" value="2.0"/>
      </map>
    mode: '0644'
    force: false

- name: Create web app icon and profile directories
  ansible.builtin.file:
