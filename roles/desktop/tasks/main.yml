---
# Split on the *network* axis (see docs/superpowers/plans/
# 2026-06-29-robust-convergence.md). Nearly all of this role edits config files
# EndeavourOS already placed, or installs gatherd's own scripts, so it converges
# offline and the first session looks like yours before anything is downloaded.
# Only the handful of tasks needing the network or a package from the REST tier
# live in rest.yml.
#
# This importer keeps the monolith running both tiers in one pass; site-core.yml
# imports core.yml alone once the split is wired up.
- name: Converge the local-only desktop tier
  ansible.builtin.import_tasks: core.yml

- name: Converge the network-dependent desktop tier
  ansible.builtin.import_tasks: rest.yml
