---
# Network operation (a git clone), so it lives here in REST rather than
# alongside the rest of tablet mode's setup in tasks/core.yml. See
# tablet_mode_upstream.yml for why.
- name: Install the tablet-mode mechanism from upstream
  ansible.builtin.import_tasks: tablet_mode_upstream.yml
  when: tablet_mode_supported

- name: Configure the credential prompt
  ansible.builtin.include_tasks: nowayprompt.yml

- name: Pre-fetch Vencord so Vesktop's first launch needs no network
  ansible.builtin.include_tasks: vesktop_vencord.yml

- name: Configure xed font size for 80-col two-up layout
  ansible.builtin.shell: |
    font="JetBrains Mono {{ foot_font_size }}"
    cur=$(dbus-run-session gsettings get org.x.editor.preferences.editor editor-font 2>/dev/null)
    use=$(dbus-run-session gsettings get org.x.editor.preferences.editor use-default-font 2>/dev/null)
    if [ "$cur" = "'$font'" ] && [ "$use" = "false" ]; then
      echo ok
    else
      dbus-run-session gsettings set org.x.editor.preferences.editor use-default-font false
      dbus-run-session gsettings set org.x.editor.preferences.editor editor-font "$font"
      echo changed
    fi
  register: _xed_font
  changed_when: _xed_font.stdout == 'changed'

- name: Enable arch-update timer
  # systemd-specific; will need a different mechanism on Artix/s6
  ansible.builtin.file:
    path: "{{ target_home }}/.config/systemd/user/timers.target.wants/arch-update.timer"
    src: /usr/lib/systemd/user/arch-update.timer
    state: link

- name: Download and convert web app icons
  # gatherd-fetch-webapp-icon resolves the best source per app: official 512px
  # App Store artwork via the iTunes Lookup API (item.app_store_id), else a pinned
  # item.icon_url, else DuckDuckGo's favicon (one URL pattern, sidesteps per-site
  # bot blocking). A single failure must not abort site.yml — that would skip the
  # gatherd-prompt-* installs and autostart entries later in this role — so
  # failed_when is false; the next task reports stragglers, the creates guard
  # refetches them next run, and fuzzel shows a generic glyph meanwhile.
  ansible.builtin.command:
    argv:
      - "{{ setup_dir }}/scripts/gatherd-fetch-webapp-icon"
      - "{{ target_home }}/.local/share/ice/icons/{{ item.codename }}.png"
      - "{{ item.app_store_id | default('') }}"
      - "{{ item.icon_url | default('') }}"
      - "https://icons.duckduckgo.com/ip3/{{ item.url | urlsplit('hostname') }}.ico"
    creates: "{{ target_home }}/.local/share/ice/icons/{{ item.codename }}.png"
  loop: "{{ web_apps }}"
  register: _favicon_dl
  changed_when: _favicon_dl.rc == 0
  failed_when: false

- name: Report web app favicons that could not be fetched or converted
  ansible.builtin.debug:
    msg: "Favicon failed for {{ item.item.codename }}: {{ item.stderr | default('skipped') | trim }}"
  loop: "{{ _favicon_dl.results }}"
  loop_control:
    label: "{{ item.item.codename | default('?') }}"
  when:
    - item.rc is defined
    - item.rc != 0

- name: Download and verify web app browser extensions
  # Helium cannot install from the Web Store at all: the extension update URL is
  # domain-substituted to a host that does not resolve. An unpacked directory named
  # with --load-extension is the only way in, and Chromium verifies nothing it is
  # handed that way, so gatherd-fetch-browser-extension checks the CRX signature
  # itself and pins the official extension id. As with favicons, one failed
  # download must not abort the rest of this role; the creates guard refetches next
  # run, and until then the entry is rendered without that extension.
  ansible.builtin.command:
    argv:
      - "{{ setup_dir }}/scripts/gatherd-fetch-browser-extension"
      - "{{ target_home }}/.local/share/ice/extensions/{{ item.name }}"
      - "{{ item.id }}"
    creates: "{{ target_home }}/.local/share/ice/extensions/{{ item.name }}/manifest.json"
  loop: "{{ web_app_extensions }}"
  loop_control:
    label: "{{ item.name }}"
  register: _web_app_extension_dl
  changed_when: _web_app_extension_dl.rc == 0
  failed_when: false

- name: Report web app browser extensions that could not be installed
  ansible.builtin.debug:
    msg: "Extension failed for {{ item.item.name }}: {{ item.stderr | default('skipped') | trim }}"
  loop: "{{ _web_app_extension_dl.results }}"
  loop_control:
    label: "{{ item.item.name | default('?') }}"
  when:
    - item.rc is defined
    - item.rc != 0

- name: Download the Waterfox web app add-ons
  # Waterfox takes AMO's signed XPIs directly, and verifies the signature itself
  # at install time -- unlike the Chromium side, where Helium cannot reach the Web
  # Store at all. As with the other downloads here, one failure must not abort the
  # role; the creates guard retries next converge.
  ansible.builtin.command:
    argv:
      - "{{ setup_dir }}/scripts/gatherd-fetch-amo-extension"
      - "{{ target_home }}/.local/share/ice/waterfox-profiles/{{ item.0.codename }}/extensions/{{ item.1.id }}.xpi"
      - "{{ item.1.slug }}"
      - "{{ item.1.id }}"
    creates: "{{ target_home }}/.local/share/ice/waterfox-profiles/{{ item.0.codename }}/extensions/{{ item.1.id }}.xpi"
  loop: "{{ waterfox_web_apps | product(waterfox_extensions) | list }}"
  loop_control:
    label: "{{ item.0.codename }}/{{ item.1.slug }}"
  register: _speech_polyfill_dl
  changed_when: _speech_polyfill_dl.rc == 0
  failed_when: false

- name: Report Waterfox add-on downloads that failed
  ansible.builtin.debug:
    msg: "Add-on failed for {{ item.item.0.codename }}/{{ item.item.1.slug }}: {{ item.stderr | default('skipped') | trim }}"
  loop: "{{ _speech_polyfill_dl.results }}"
  loop_control:
    label: "{{ item.item.0.codename | default('?') }}"
  when:
    - item.rc is defined
    - item.rc != 0

- name: Download the speech model for Waterfox web apps
  # Otherwise the first speaking exercise pays for a ~44MB download mid-lesson.
  # The add-on fetches its model at browser startup when cacheDefaultModel is set,
  # so one headless run here gets it onto disk while the machine is converging.
  # Non-fatal: without it the old first-use download still works.
  ansible.builtin.command:
    argv:
      - "{{ setup_dir }}/scripts/gatherd-warm-speech-model"
      - waterfox
      - "{{ target_home }}/.local/share/ice/waterfox-profiles/{{ item.codename }}"
      - "300"
    creates: "{{ target_home }}/.local/share/ice/waterfox-profiles/{{ item.codename }}/.gatherd-model-warmed"
  loop: "{{ waterfox_web_apps }}"
  loop_control:
    label: "{{ item.codename }}"
  register: _speech_model_warm
  changed_when: _speech_model_warm.rc == 0
  failed_when: false

- name: Re-create web app desktop entries now the extensions are on disk
  ansible.builtin.import_tasks: web_app_entries.yml

- name: Fix missing fuzzel icons
  # Scans all .desktop entries and remediates known gap patterns: XPM-only icons
  # in pixmaps (converted to PNG), SVGs filed under non-apps theme contexts
  # (copied to hicolor/scalable/apps), and Icon= names with non-standard
  # extensions (local .desktop override with the bare name). Idempotent.
  ansible.builtin.script:
    cmd: "{{ setup_dir }}/scripts/gatherd-fix-fuzzel-icons"
  register: _fuzzel_icons
  changed_when: "'changed' in _fuzzel_icons.stdout"
