---
# The mechanism itself (fold detection, rotation, input suppression, the
# compositor adapter, the escape menu) is no longer gatherd's: it lives in
# chuwi-minibook-tablet-mode, cloned and installed by tablet_mode_upstream.yml
# in REST (roles/desktop/tasks/rest.yml), never here — that clone is a network
# operation, and CORE must converge with no internet at all. This file installs
# only what stays gatherd's: the sheet-music picker, and the config/menu that
# tell the mechanism what to run.
- name: Install the music-stand scripts
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/{{ item }}"
    dest: "{{ target_home }}/.local/bin/{{ item }}"
    mode: '0755'
    remote_src: true
  loop:
    - gatherd-music-index
    - gatherd-music-stand

# The mechanism's own install.sh would create this, but it runs in REST and
# this is CORE: the config has to land in a directory that exists before the
# clone the config belongs to has ever been fetched.
- name: Create the tablet-mode config directory
  ansible.builtin.file:
    path: "{{ target_home }}/.config/minibook-tablet-mode"
    state: directory
    mode: '0755'

- name: Configure tablet mode
  ansible.builtin.template:
    src: tablet-mode.conf.j2
    dest: "{{ target_home }}/.config/minibook-tablet-mode/config"
    mode: '0644'

# The folded menu's entries used to be hardcoded in the power-button script;
# the mechanism now reads them from this file, one label|command per line, so
# it has no idea a sheet-music reader exists. See tablet_mode_menu_entries.
- name: Configure the folded menu
  ansible.builtin.template:
    src: tablet-mode-menu.j2
    dest: "{{ target_home }}/.config/minibook-tablet-mode/menu"
    mode: '0644'

# Removed, not merely unbound: folding is the only way into tablet mode and
# unfolding is always the way out, so a keystroke that enters it would create
# exactly the case the hinge daemon can no longer get you out of - a session
# begun at a typing angle, which unfolding cannot end because it never
# started folded. `state: absent` rather than deleting this task outright, so
# converging a machine that already carries the old bindings removes them.
#
# `binding`, not `keys`: Jinja2 resolves item.keys to the dict's built-in
# keys() method rather than the value, which fails silently and confusingly.
- name: Unbind the old tablet mode and music stand keystrokes in sway
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/default"
    regexp: "^\\s*bindsym\\s+{{ item.binding | regex_escape }}\\s"
    state: absent
  loop:
    - binding: $mod+t
    - binding: $mod+Shift+t

# NOT `fullscreen enable`: sway's own rule fires (event trace confirms
# fullscreen_mode=1 moments after mapping) but papers immediately restores its
# own persisted (non-fullscreen) window state and clobbers it, so the rule
# bought nothing but a visible flicker. gatherd-music-stand launches the
# viewer with its own fullscreen flag instead, which is what actually sticks.
#
# NOT `inhibit_idle fullscreen` either: that inhibits only while fullscreen,
# so the moment papers wins the race above, the inhibitor disengages and the
# screen blanks mid-piece — the one thing this feature exists to prevent.
# `visible` inhibits for as long as the score is on screen, fullscreen or not,
# which is the actual safety property wanted. minibook-tablet-mode additionally
# inhibits `open` on every view for the whole of tablet mode, not just this
# one window; see docs/superpowers/specs/2026-08-16-tablet-mode-design.md.
- name: Keep the screen awake while the score is visible
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.config/sway/config.d/default"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: music stand"
    block: |
      for_window [app_id="{{ music_stand_app_id }}"] inhibit_idle visible
