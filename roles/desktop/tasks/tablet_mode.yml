---
- name: Install the tablet-mode scripts
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/{{ item }}"
    dest: "{{ target_home }}/.local/bin/{{ item }}"
    mode: '0755'
    remote_src: true
  loop:
    - gatherd-tablet-mode
    - gatherd-music-index
    - gatherd-music-stand
    - gatherd-power-button

- name: Configure tablet mode
  ansible.builtin.template:
    src: tablet-mode.conf.j2
    dest: "{{ target_home }}/.config/gatherd/tablet-mode.conf"
    mode: '0644'

# Phase 2 (fold-to-trigger): only on machines with the second, base-sensor
# accelerometer gatherd-hinge-daemon needs to compute a hinge angle at all.
# gatherd-bind-hinge-sensor.service (roles/system) instantiates that sensor at
# boot; a single-accelerometer machine gets phase 1 (manual trigger) only.
- name: Install the hinge-fold daemon
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/gatherd-hinge-daemon"
    dest: "{{ target_home }}/.local/bin/gatherd-hinge-daemon"
    mode: '0755'
    remote_src: true
  when: has_dual_accelerometer

# `binding`, not `keys`: Jinja2 resolves item.keys to the dict's built-in
# keys() method rather than the value, which fails silently and confusingly.
- name: Bind tablet mode and music stand in sway
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.config/sway/config.d/default"
    line: "bindsym {{ item.binding }} exec {{ target_home }}/.local/bin/{{ item.script }} toggle"
    regexp: "^\\s*bindsym\\s+{{ item.binding | regex_escape }}\\s"
  loop:
    - binding: $mod+t
      script: gatherd-tablet-mode
    - binding: $mod+Shift+t
      script: gatherd-music-stand

# NOT `fullscreen enable`: sway's own rule fires (event trace confirms
# fullscreen_mode=1 moments after mapping) but papers immediately restores its
# own persisted (non-fullscreen) window state and clobbers it, so the rule
# bought nothing but a visible flicker. gatherd-music-stand launches the
# viewer with its own fullscreen flag instead, which is what actually sticks.
#
# NOT `inhibit_idle fullscreen` either: that inhibits only while fullscreen,
# so the moment papers wins the race above, the inhibitor disengages and the
# screen blanks mid-piece — the one thing this feature exists to prevent.
# `visible` inhibits for as long as the score is on screen, fullscreen or not,
# which is the actual safety property wanted. gatherd-tablet-mode additionally
# inhibits `open` on every view for the whole of tablet mode, not just this
# one window; see docs/superpowers/specs/2026-08-16-tablet-mode-design.md.
- name: Keep the screen awake while the score is visible
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.config/sway/config.d/default"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: music stand"
    block: |
      for_window [app_id="{{ music_stand_app_id }}"] inhibit_idle visible
