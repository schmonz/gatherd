---
# Enable zswap for machines with limited RAM.
# Targets GRUB_CMDLINE_LINUX_DEFAULT — performance optimization, not needed in recovery.
# Also pre-seeded in `postinstall` (preseed_grub_cmdline_fixes) so zswap is live
# for the heaviest run of all — the first boot's AUR builds. Keep the zswap.*
# params in sync there. This task stays the applier for machines that pull the
# change after install, and is a no-op when postinstall already added it.
- name: Enable zswap in GRUB
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?!.*zswap.enabled=1).*)(")\s*$'
    replace: '\1 zswap.enabled=1 zswap.compressor=zstd zswap.zpool=z3fold zswap.max_pool_percent=20\2'
  notify: Rebuild grub
  when: has_grub
