---
# ── Shared inputs (reused by multiple probes) ─────────────────────────────────

- name: Stat /proc/acpi/button/lid/LID0/state
  ansible.builtin.stat:
    path: /proc/acpi/button/lid/LID0/state
  register: _lid_state

- name: Stat /dev/cros_ec
  ansible.builtin.stat:
    path: /dev/cros_ec
  register: _dev_cros_ec

- name: Stat /sys/class/chromeos/cros_ec
  ansible.builtin.stat:
    path: /sys/class/chromeos/cros_ec
  register: _sys_cros_ec

- name: Collect PCI device list
  ansible.builtin.command: lspci -n
  register: _lspci
  changed_when: false

# ── Probes ────────────────────────────────────────────────────────────────────

# MrChromebox firmware replaces the stock EFI; suspend/resume not supported.
- name: Detect has_resume
  ansible.builtin.set_fact:
    has_resume: false
  when: ansible_facts.bios_version | default('') is match('MrChromebox.*')

# Lid events: present only if LID0 ACPI node exists, Chrome EC is absent, and
# the kernel exposes a "Lid Switch" input device. On Chromebooks the EC handles
# lid events in firmware — no kernel input events are generated.
- name: Check for Lid Switch input device
  ansible.builtin.shell: |
    grep -rql "Lid Switch" /sys/class/input/input*/name 2>/dev/null && echo true || echo false
  register: _lid_switch
  changed_when: false
  when: _lid_state.stat.exists and not _dev_cros_ec.stat.exists

- name: Detect has_lid_events
  ansible.builtin.set_fact:
    has_lid_events: false
  when: >
    _lid_state.stat.exists and (
      _dev_cros_ec.stat.exists or
      (_lid_switch.stdout | default('false')) == 'false'
    )

# Power button: logind grabs the LNXPWRBN device exclusively (power-switch udev
# tag). A non-LNXPWRBN "Power Button" (e.g. Apple firmware) bypasses that grab,
# so events still reach the compositor even if LNXPWRBN is tagged.
- name: Check for non-LNXPWRBN power button
  ansible.builtin.shell: |
    for d in /sys/class/input/input*/; do
      name=$(cat "${d}name" 2>/dev/null) || continue
      phys=$(cat "${d}phys" 2>/dev/null) || continue
      [[ "$name" == "Power Button" && "$phys" != *LNXPWRBN* ]] && { echo true; exit; }
    done
    echo false
  register: _non_lnx_power_button
  changed_when: false

- name: Check if LNXPWRBN button carries power-switch udev tag
  ansible.builtin.shell: |
    set -o pipefail
    for d in /sys/class/input/input*/; do
      name=$(cat "${d}name" 2>/dev/null) || continue
      phys=$(cat "${d}phys" 2>/dev/null) || continue
      [[ "$name" == "Power Button" && "$phys" == *LNXPWRBN* ]] || continue
      for ev in "${d}"event*/; do
        udevadm info "/dev/input/$(basename "$ev")" 2>/dev/null \
          | grep -q "power-switch" && { echo true; exit; }
      done
    done
    echo false
  args:
    executable: /bin/bash
  register: _lnx_power_switch_tagged
  changed_when: false
  when: _non_lnx_power_button.stdout == 'false'

- name: Detect has_powerbutton_events
  ansible.builtin.set_fact:
    has_powerbutton_events: false
  when:
    - _non_lnx_power_button.stdout == 'false'
    - (_lnx_power_switch_tagged.stdout | default('false')) == 'true'

# Chrome EC present → Chromebook: kernel emits no F-key events, and AVS audio setup needed.
- name: Detect has_cros_fkeys and has_avs_audio
  ansible.builtin.set_fact:
    has_cros_fkeys: true
    has_avs_audio: true
  when: _dev_cros_ec.stat.exists or _sys_cros_ec.stat.exists

- name: Check for IIO illuminance sensor
  ansible.builtin.shell: |
    set -o pipefail
    ls /sys/bus/iio/devices/*/in_illuminance* 2>/dev/null | grep -q . && echo true || echo false
  args:
    executable: /bin/bash
  register: _als
  changed_when: false

- name: Detect has_ambient_light_sensor
  ansible.builtin.set_fact:
    has_ambient_light_sensor: true
  when: _als.stdout == 'true'

- name: Check for screen backlight
  ansible.builtin.shell: |
    set -o pipefail
    ls /sys/class/backlight/ 2>/dev/null | grep -q . && echo true || echo false
  args:
    executable: /bin/bash
  register: _screen_backlight
  changed_when: false

- name: Detect has_screen_backlight
  ansible.builtin.set_fact:
    has_screen_backlight: true
  when: _screen_backlight.stdout == 'true'

- name: Check for keyboard backlight LED
  ansible.builtin.shell: |
    set -o pipefail
    ls /sys/class/leds/ 2>/dev/null | grep -qiE "kbd|keyboard" && echo true || echo false
  args:
    executable: /bin/bash
  register: _kbd_backlight
  changed_when: false

- name: Detect has_kbd_backlight
  ansible.builtin.set_fact:
    has_kbd_backlight: true
  when: _kbd_backlight.stdout == 'true'

# Apple Mac hardware needs mbpfan for fan control.
- name: Detect has_applesmc
  ansible.builtin.set_fact:
    has_applesmc: true
  when:
    - ansible_facts.system_vendor | default('') == "Apple Inc."
    - ansible_facts.product_name | default('') is match('MacBook.*')

# Broadcom FaceTime HD camera (PCI 14e4:1570) needs out-of-tree driver.
- name: Detect has_facetimehd
  ansible.builtin.set_fact:
    has_facetimehd: true
  when: "'14e4:1570' in _lspci.stdout"

# MacBookPro5,2 exposes a phantom LVDS-2 output that confuses display layout.
# Requires GPU driver to be loaded — may be false in a pre-driver environment.
- name: Check for phantom LVDS-2 display
  ansible.builtin.shell: |
    set -o pipefail
    ls /sys/class/drm/ 2>/dev/null | grep -q "LVDS-2" && echo true || echo false
  args:
    executable: /bin/bash
  register: _phantom
  changed_when: false

- name: Detect has_phantom_second_display
  ansible.builtin.set_fact:
    has_phantom_second_display: true
  when: _phantom.stdout == 'true'

# Chuwi MiniBook X: the internal DSI panel is physically mounted rotated 90°,
# so it scans out sideways for normal laptop use until the kernel cmdline
# rotates both the framebuffer console and the DRM panel orientation.
- name: Detect has_rotated_panel
  ansible.builtin.set_fact:
    has_rotated_panel: true
  when: ansible_facts.product_name | default('') == 'MiniBook X'

# >= 8 GB RAM → skip zswap.
- name: Detect has_plenty_of_ram
  ansible.builtin.set_fact:
    has_plenty_of_ram: true
  when: ansible_facts.memtotal_mb >= 8192

# AVX = x86-64-v3 floor; gates AVX-requiring binaries (e.g. the claude-code
# native bundle, which SIGILLs on pre-AVX CPUs like the Core 2 T60). Any
# AVX-capable CPU also has SSE4.2/POPCNT, so this one flag is sufficient.
- name: Check for AVX CPU support  # noqa: risky-shell-pipe
  ansible.builtin.shell: |
    grep -qm1 -E '^flags\b.*\bavx\b' /proc/cpuinfo && echo true || echo false
  register: _avx
  changed_when: false

- name: Detect has_avx
  ansible.builtin.set_fact:
    has_avx: true
  when: _avx.stdout == 'true'

- name: Check for infrared remote control receiver  # noqa: risky-shell-pipe
  # /dev/lirc*: traditional LIRC path (requires lirc kernel module)
  # /sys/class/rc/rc*: modern rc-core path (Apple Remote, most built-ins)
  # /dev/irda* and /sys/class/irda/ are IrDA data ports — intentionally excluded.
  ansible.builtin.shell: |
    ls /dev/lirc* /sys/class/rc/rc* 2>/dev/null | grep -q . && echo true || echo false
  register: _ir_receiver
  changed_when: false

- name: Detect has_ir_receiver
  ansible.builtin.set_fact:
    has_ir_receiver: true
  when: _ir_receiver.stdout == 'true'

# Only known-supported fingerprint readers count. Today that's Validity 138a:0097
# (driven by python-validity); add USB IDs here as we encounter more.
- name: Check USB devices for a supported fingerprint reader
  ansible.builtin.shell: |
    for dev in /sys/bus/usb/devices/*; do
      [ -e "$dev/idVendor" ] || continue
      v=$(cat "$dev/idVendor")
      p=$(cat "$dev/idProduct")
      case "$v:$p" in
        138a:0097) echo true; exit 0 ;;
      esac
    done
    echo false
  register: _fingerprint_reader
  changed_when: false

- name: Detect has_fingerprint_reader
  ansible.builtin.set_fact:
    has_fingerprint_reader: true
  when: _fingerprint_reader.stdout == 'true'

# Lenovo ThinkPad SMBIOS — TrackPoint buttons, smart card, fingerprint reader
# are ThinkPad-specific.
- name: Detect has_thinkpad_hardware
  ansible.builtin.set_fact:
    has_thinkpad_hardware: true
  when:
    - ansible_facts.system_vendor | default('') == "LENOVO"
    - >
      'ThinkPad' in (ansible_facts.product_name | default('')) or
      'ThinkPad' in (ansible_facts.product_version | default(''))

- name: Check for TrackPoint input device  # noqa: risky-shell-pipe
  ansible.builtin.shell: |
    grep -rl "TrackPoint" /sys/class/input/input*/name 2>/dev/null | grep -q . && echo true || echo false
  register: _trackpoint
  changed_when: false

- name: Detect has_thinkpad_trackpoint
  ansible.builtin.set_fact:
    has_thinkpad_trackpoint: true
  when: _trackpoint.stdout == 'true'

# The ThinkVantage button needs no fact: its sway bind (XF86Launch1) is inert
# on machines without the button, so the desktop role binds it unconditionally.

- name: Stat /etc/default/grub
  ansible.builtin.stat:
    path: /etc/default/grub
  register: _etc_default_grub

- name: Detect has_grub
  ansible.builtin.set_fact:
    has_grub: true
  when: _etc_default_grub.stat.exists

- name: Stat /boot/extlinux/extlinux.conf
  ansible.builtin.stat:
    path: /boot/extlinux/extlinux.conf
  register: _extlinux_conf

- name: Detect has_extlinux
  ansible.builtin.set_fact:
    has_extlinux: true
  when: _extlinux_conf.stat.exists

# Pinebook Pro overlays a numpad on part of the keyboard — letters shadow numpad,
# not the other way, so numlock-on makes letters unreachable.
- name: Check for embedded numpad keyboard
  ansible.builtin.shell: |
    grep -q "Pinebook Pro" /proc/device-tree/model 2>/dev/null && echo true || echo false
  register: _embedded_numpad
  changed_when: false

- name: Detect has_embedded_numpad
  ansible.builtin.set_fact:
    has_embedded_numpad: true
  when: _embedded_numpad.stdout == 'true'

# Timeshift in BTRFS mode needs the root BTRFS filesystem UUID and (when the
# filesystem sits on a LUKS container) the UUID of the underlying partition.
# Detect both so the system role can write /etc/timeshift/timeshift.json
# without the GUI's "click Finish" step.
- name: Read root mount source, fstype, and UUID
  ansible.builtin.command: findmnt / -no SOURCE,FSTYPE,UUID
  register: _root_mount
  changed_when: false

- name: Parse root mount fields
  ansible.builtin.set_fact:
    # findmnt prints the source as "/dev/mapper/luks-XXX[/@subvol]" for a BTRFS
    # subvolume mount; strip the bracketed subvolume to get the device path.
    _root_source: "{{ _root_mount.stdout.split()[0] | regex_replace('\\[.*\\]$', '') }}"
    _root_fstype: "{{ _root_mount.stdout.split()[1] }}"
    _root_uuid: "{{ _root_mount.stdout.split()[2] }}"

- name: Find UUID of LUKS container under root  # noqa: risky-shell-pipe
  # lsblk -s walks the device tree toward parents; for the BTRFS root mapper,
  # the crypto_LUKS line is the partition we want. PKNAME returns empty for
  # mapper devices so use -s + fstype filter instead.
  ansible.builtin.shell: >
    lsblk -snlo NAME,UUID,FSTYPE {{ _root_source }} | awk '$3=="crypto_LUKS"{print $2; exit}'
  register: _root_parent_uuid
  changed_when: false
  when:
    - _root_source is match('^/dev/mapper/luks-')
    - _root_fstype == 'btrfs'

- name: Detect has_luks_btrfs_root
  ansible.builtin.set_fact:
    has_luks_btrfs_root: true
    timeshift_backup_device_uuid: "{{ _root_uuid }}"
    timeshift_parent_device_uuid: "{{ _root_parent_uuid.stdout | trim }}"
  when:
    - _root_parent_uuid is not skipped
    - (_root_parent_uuid.stdout | default('')) | trim | length > 0

- name: Compute foot font size for this panel
  # gatherd-font-size reads the panel's native resolution and physical dimensions
  # from EDID and applies the two-up 80-column formula. Emits the font size on
  # line 1; emits "hidpi" on line 2 when PPI >= 192 (2x Sway scale expected).
  ansible.builtin.command: "{{ setup_dir }}/scripts/gatherd-font-size"
  register: _foot_font_size
  changed_when: false

- name: Set foot_font_size fact
  ansible.builtin.set_fact:
    foot_font_size: "{{ _foot_font_size.stdout_lines[0] | int }}"
  when: (_foot_font_size.stdout_lines[0] | default('')) | int > 0

- name: Detect has_hidpi_display
  ansible.builtin.set_fact:
    has_hidpi_display: true
  when: "'hidpi' in (_foot_font_size.stdout_lines | default([]))"

# Role defaults only apply within this role. This task promotes every has_* fact
# to a host fact so later plays (system, desktop) can reference them without error.
- name: Publish hardware facts for cross-play use
  ansible.builtin.set_fact:
    has_resume: "{{ has_resume }}"
    has_lid_events: "{{ has_lid_events }}"
    has_powerbutton_events: "{{ has_powerbutton_events }}"
    has_avs_audio: "{{ has_avs_audio }}"
    has_ambient_light_sensor: "{{ has_ambient_light_sensor }}"
    has_applesmc: "{{ has_applesmc }}"
    has_cros_fkeys: "{{ has_cros_fkeys }}"
    has_embedded_numpad: "{{ has_embedded_numpad }}"
    has_extlinux: "{{ has_extlinux }}"
    has_facetimehd: "{{ has_facetimehd }}"
    has_fingerprint_reader: "{{ has_fingerprint_reader }}"
    has_grub: "{{ has_grub }}"
    has_ir_receiver: "{{ has_ir_receiver }}"
    has_kbd_backlight: "{{ has_kbd_backlight }}"
    has_luks_btrfs_root: "{{ has_luks_btrfs_root }}"
    has_hidpi_display: "{{ has_hidpi_display }}"
    has_phantom_second_display: "{{ has_phantom_second_display }}"
    has_plenty_of_ram: "{{ has_plenty_of_ram }}"
    has_avx: "{{ has_avx }}"
    has_screen_backlight: "{{ has_screen_backlight }}"
    has_thinkpad_hardware: "{{ has_thinkpad_hardware }}"
    has_thinkpad_trackpoint: "{{ has_thinkpad_trackpoint }}"
    is_aarch64: "{{ is_aarch64 }}"
    foot_font_size: "{{ foot_font_size }}"
    timeshift_backup_device_uuid: "{{ timeshift_backup_device_uuid }}"
    timeshift_parent_device_uuid: "{{ timeshift_parent_device_uuid }}"
