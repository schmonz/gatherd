---
# The AUR build machinery, and the local pacman repository it builds into.
#
# What this replaces: four sites that granted target_user
# `NOPASSWD: /usr/bin/pacman` in /etc/sudoers for the duration of an AUR build
# and revoked it in a block's always:. always: runs when a TASK fails but not
# when the process is killed -- Ctrl-C, systemctl stop, a reboot mid-build --
# so the line could outlive the run, and `pacman -U <any file>` is root.
#
# aurutils splits the job in two so no grant is needed at any point: makepkg
# runs as target_user and adds the result to a local repo with repo-add, then
# root installs it from there with an ordinary `pacman -S`. Both halves already
# run with exactly the privilege they need, so there is nothing to grant.
#
# Lives in the system role, not the aur role, because /etc/pacman.conf and
# /var/cache are system property, and because the hardware role builds AUR
# packages in this same play -- it has to be set up before then.

- name: Create the local AUR repository directory
  ansible.builtin.file:
    path: "{{ aur_repo_dir }}"
    state: directory
    owner: "{{ target_user }}"
    mode: '0755'

# repo-add with no packages named creates an empty database, which is what a
# fresh machine needs: pacman refuses to parse a repo whose db is missing.
# Guarded on the TARBALL, not the .db symlink -- see the repair task below for
# why those are not the same question.
- name: Initialize the local AUR repository database
  ansible.builtin.command: "repo-add {{ aur_repo_dir }}/{{ aur_repo_name }}.db.tar.zst"
  args:
    creates: "{{ aur_repo_dir }}/{{ aur_repo_name }}.db.tar.zst"
  become: true
  become_user: "{{ target_user }}"

# repo-add takes a lock and removes it from EXIT/TERM/INT traps -- none of which
# run on SIGKILL. `systemctl stop gatherd-async.service` mid-write therefore
# leaves the lock behind, and every later build dies with "Failed to acquire
# lockfile". Reproduced: repo-add exits non-zero and touches nothing.
#
# Only safe because gatherd's builds are serialised within one play, so a lock
# still present when this task runs is by definition nobody's. The pgrep guard
# keeps a hand-run `aur sync` in another terminal from being stomped.
- name: Check whether a repo-add is genuinely running  # noqa: command-instead-of-module
  ansible.builtin.command: pgrep -x repo-add
  register: _repo_add_running
  changed_when: false
  failed_when: false

- name: Clear a stale repository lock left by a killed build
  ansible.builtin.file:
    path: "{{ aur_repo_dir }}/{{ aur_repo_name }}.db.tar.zst.lck"
    state: absent
  when: _repo_add_running.rc != 0

# repo-add's rotate_db does `rm -f <db>` then `ln -s`. Killed in that window,
# the tarball survives and the symlink does not -- and repo-add will NOT put it
# back: with the tarball present and nothing to add it prints "No changes made
# to package database" and returns success, so a `creates:`-guarded re-run
# no-ops forever while pacman cannot read the repo. Reproduced, and reproduced
# that recreating the symlink by hand is the whole repair.
- name: Repair the repository database symlinks
  ansible.builtin.file:
    src: "{{ aur_repo_name }}{{ item }}.tar.zst"
    dest: "{{ aur_repo_dir }}/{{ aur_repo_name }}{{ item }}"
    state: link
    force: true
    follow: false
  loop: ['.db', '.files']
  become: true
  become_user: "{{ target_user }}"

# Appended, so an official repo always wins a name collision with something
# built here. SigLevel is Optional TrustAll because our own builds are
# unsigned; the repo is reachable only over file:// on a directory this machine
# owns.
- name: Register the local AUR repository with pacman
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK gatherd local AUR repository"
    block: |
      [{{ aur_repo_name }}]
      SigLevel = Optional TrustAll
      Server = file://{{ aur_repo_dir }}
  notify: Etckeeper commit

# Registering a repo does not create its sync database, and pacman refuses to
# prepare ANY transaction while a configured repo's database is missing -- even
# one that has nothing to do with that repo. `pacman -S <anything>` dies with
# "failed to prepare transaction (could not find database)". So without this,
# the next plain `pacman -S` in the run fails, and on a fresh machine that is
# whatever the hardware role installs first. That is why the VM test never saw
# it: every package task in the hardware role is gated on hardware the VM does
# not have, and every AUR install task passes `update_cache:`, which syncs as a
# side effect and papered over the gap on the paths the test does reach.
#
# Guarded on the sync database rather than on the blockinfile above having
# changed: a machine that registered the repo and then failed before syncing --
# i.e. every machine this has already bitten -- has an unchanged pacman.conf,
# so a changed-guarded sync would never repair it.
- name: Check for the local AUR repository's sync database
  ansible.builtin.stat:
    path: "/var/lib/pacman/sync/{{ aur_repo_name }}.db"
  register: _aur_repo_sync_db

- name: Populate the local AUR repository's sync database
  community.general.pacman:
    update_cache: true
  when: not _aur_repo_sync_db.stat.exists

- name: Read the pinned aurutils pkgver from the vendored PKGBUILD  # noqa: command-instead-of-module
  ansible.builtin.command: "grep -m1 -oP '(?<=^pkgver=).*' {{ setup_dir }}/packaging/aurutils/PKGBUILD"
  register: _aurutils_pkgver
  changed_when: false

- name: Read the pinned aurutils pkgrel from the vendored PKGBUILD  # noqa: command-instead-of-module
  ansible.builtin.command: "grep -m1 -oP '(?<=^pkgrel=).*' {{ setup_dir }}/packaging/aurutils/PKGBUILD"
  register: _aurutils_pkgrel
  changed_when: false

- name: Check whether aurutils is installed  # noqa: command-instead-of-module
  ansible.builtin.command: pacman -Q aurutils
  register: _aurutils_installed
  changed_when: false
  failed_when: false

# Compares the full pkgver-pkgrel, not just presence, so a deliberate version
# bump in the vendored PKGBUILD actually rebuilds.
- name: Build and install aurutils from the vendored PKGBUILD
  when: >-
    _aurutils_installed.rc != 0 or
    _aurutils_installed.stdout.split(' ')[1] != _aurutils_pkgver.stdout + '-' + _aurutils_pkgrel.stdout
  block:
    - name: Create a scratch directory for the aurutils build
      ansible.builtin.file:
        path: "{{ target_home }}/.cache/gatherd/aurutils"
        state: directory
        owner: "{{ target_user }}"
        mode: '0755'

    - name: Copy the vendored PKGBUILD into the scratch directory
      ansible.builtin.copy:
        src: "{{ setup_dir }}/packaging/aurutils/PKGBUILD"
        dest: "{{ target_home }}/.cache/gatherd/aurutils/PKGBUILD"
        owner: "{{ target_user }}"
        mode: '0644'
        remote_src: true

    # Plain makepkg, deliberately without -s: -s is the only thing that would
    # make makepkg shell out to sudo, and the whole point of this file is that
    # nothing here can. aurutils' six dependencies are declared in
    # rest_packages and installed by root before this runs.
    - name: Find aurutils artifacts from earlier builds
      ansible.builtin.find:
        paths: "{{ target_home }}/.cache/gatherd/aurutils"
        patterns: "*.pkg.tar.zst"
      register: _aurutils_stale

    - name: Build aurutils
      ansible.builtin.command: makepkg --noconfirm
      args:
        chdir: "{{ target_home }}/.cache/gatherd/aurutils"
      become: true
      become_user: "{{ target_user }}"
      changed_when: true

    # Clear old artifacts first. makepkg leaves every build it has ever done in
    # place, so after a pkgver bump the directory holds two *.pkg.tar.zst and
    # the "exactly one" guard below fires -- a failure that only appears on the
    # upgrade path, which is the path nobody exercises until it matters.
    - name: Remove aurutils artifacts from earlier builds
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _aurutils_stale.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      become: true
      become_user: "{{ target_user }}"

    - name: Find the built aurutils package
      ansible.builtin.find:
        paths: "{{ target_home }}/.cache/gatherd/aurutils"
        patterns: "*.pkg.tar.zst"
      register: _aurutils_built

    - name: Fail unless the build produced exactly one aurutils package
      ansible.builtin.fail:
        msg: >-
          Expected exactly one *.pkg.tar.zst in
          {{ target_home }}/.cache/gatherd/aurutils, found
          {{ _aurutils_built.files | length }}.
      when: _aurutils_built.files | length != 1

    - name: Install the built aurutils package
      community.general.pacman:
        name: "{{ _aurutils_built.files[0].path }}"
        state: present
