---
- name: Create /etc/gatherd state directory
  ansible.builtin.file:
    path: /etc/gatherd
    state: directory
    mode: '0755'

- name: Start systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: started

# This early symlink is bootstrap-only so package downloads have DNS. The same
# symlink appears again below after etckeeper is initialized, so the change is tracked.
- name: Symlink resolv.conf to stub resolver
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
    follow: false

- name: Create /etc/X11/xorg.conf.d
  ansible.builtin.file:
    path: /etc/X11/xorg.conf.d
    state: directory
    mode: '0755'

- name: Configure macOS-style keyboard layout
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/00-gatherd-keyboard.conf
    content: |
      Section "InputClass"
          Identifier "system-keyboard"
          MatchIsKeyboard "on"
          Option "XkbLayout" "us"
          Option "XkbVariant" "mac"
      EndSection
    mode: '0644'
  notify: Etckeeper commit

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Configure user-session environment
  ansible.builtin.include_tasks: user_path.yml

- name: Configure sudo's askpass and shared credential cache
  ansible.builtin.include_tasks: sudo.yml

- name: Route interactive sudo through the graphical prompt
  ansible.builtin.include_tasks: sudo_function.yml

- name: Create /etc/1password directory
  ansible.builtin.file:
    path: /etc/1password
    state: directory
    mode: '0755'
  notify: Etckeeper commit

- name: Allow Helium browser in 1Password
  ansible.builtin.lineinfile:
    path: /etc/1password/custom_allowed_browsers
    line: helium
    create: true
    mode: '0644'
  notify: Etckeeper commit

- name: Create Chromium managed-policy directory
  ansible.builtin.file:
    path: /etc/chromium/policies/managed
    state: directory
    mode: '0755'

- name: Auto-launch external apps from trusted origins (Helium)
  ansible.builtin.copy:
    dest: /etc/chromium/policies/managed/gatherd-auto-launch-protocols.json
    content: |
      {
          "AutoLaunchProtocolsFromOrigins": [
              {"protocol": "jetbrains",     "allowed_origins": ["https://account.jetbrains.com", "https://www.jetbrains.com"]},
              {"protocol": "zoommtg",       "allowed_origins": ["https://zoom.us", "https://*.zoom.us"]},
              {"protocol": "zoomus",        "allowed_origins": ["https://zoom.us", "https://*.zoom.us"]},
              {"protocol": "zoomphonecall", "allowed_origins": ["https://zoom.us", "https://*.zoom.us"]},
              {"protocol": "slack",         "allowed_origins": ["https://slack.com", "https://*.slack.com"]},
              {"protocol": "msteams",       "allowed_origins": ["https://teams.microsoft.com"]}
          ]
      }
    mode: '0644'
  notify: Etckeeper commit

- name: Allow target_user to write the vault password file as root
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gatherd-vault-pass
    content: "{{ target_user }} ALL=(root) NOPASSWD: /usr/local/lib/gatherd/scripts/gatherd-write-vault-pass\n"
    mode: '0440'
    validate: visudo -cf %s
  notify: Etckeeper commit

- name: Allow target_user to invoke the PIA login helper as root
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gatherd-pia-login
    content: "{{ target_user }} ALL=(root) NOPASSWD: /usr/local/lib/gatherd/scripts/gatherd-pia-login\n"
    mode: '0440'
    validate: visudo -cf %s
  notify: Etckeeper commit

# postinstall ranks mirrors once at install, then the list is frozen until the
# next repave. A pacman-mirrorlist upgrade is the cue that the upstream set
# shifted, so re-rank then. A pacman hook (not a systemd timer) keeps this
# init-agnostic for the Artix/s6 target. See scripts/gatherd-rerank-mirrors.
- name: Create pacman hooks directory
  ansible.builtin.file:
    path: /etc/pacman.d/hooks
    state: directory
    mode: '0755'

- name: Re-rank mirrors when the pacman-mirrorlist package updates
  ansible.builtin.copy:
    dest: /etc/pacman.d/hooks/gatherd-rerank-mirrors.hook
    content: |
      [Trigger]
      Operation = Upgrade
      Type = Package
      Target = pacman-mirrorlist

      [Action]
      Description = Re-ranking pacman mirrors with rate-mirrors...
      When = PostTransaction
      Depends = rate-mirrors
      Exec = /usr/local/lib/gatherd/scripts/gatherd-rerank-mirrors
    mode: '0644'
  notify: Etckeeper commit

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Create logind.conf.d directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    mode: '0755'

- name: Write logind power-key drop-in
  ansible.builtin.template:
    src: "{{ 'logind-power-key.conf.j2' if has_resume else 'logind-disable-sleep.conf.j2' }}"
    dest: "/etc/systemd/logind.conf.d/gatherd-{{ 'power-key' if has_resume else 'disable-sleep' }}.conf"
    mode: '0644'
  notify:
    - Reload logind
    - Etckeeper commit

- name: Remove EOS default logind suspend drop-in
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d/suspend.conf
    state: absent
  notify:
    - Reload logind
    - Etckeeper commit

- name: Read effective logind configuration
  ansible.builtin.command: systemd-analyze cat-config systemd/logind.conf
  register: _logind_config
  changed_when: false

- name: Assert IdleAction=ignore is effective
  ansible.builtin.assert:
    that: _logind_config.stdout | regex_findall('(?m)^IdleAction=.*') | last == 'IdleAction=ignore'
    fail_msg: "A drop-in is overriding IdleAction — check /etc/systemd/logind.conf.d/"

- name: Mask sleep targets
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - hibernate.target
    - hybrid-sleep.target
    - sleep.target
    - suspend-then-hibernate.target
    - suspend.target
  when: not has_resume
  notify: Etckeeper commit

- name: Create sleep.conf.d directory
  ansible.builtin.file:
    path: /etc/systemd/sleep.conf.d
    state: directory
    mode: '0755'
  when: not has_resume

- name: Write sleep disable config
  ansible.builtin.copy:
    dest: /etc/systemd/sleep.conf.d/gatherd-disable-sleep.conf
    content: |
      [Sleep]
      AllowHibernation=no
      AllowHybridSleep=no
      AllowSuspendThenHibernate=no
      AllowSuspend=no
    mode: '0644'
  when: not has_resume
  notify: Etckeeper commit

- name: Write ThinkPad power-button udev rule
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-gatherd-power-button-sway.rules
    content: |
      # Strips power-switch tag so logind releases its exclusive grab.
      # Allows libinput/Sway to handle XF86PowerOff via bindsym.
      SUBSYSTEM=="input", KERNEL=="event*", ATTRS{name}=="Power Button", ATTRS{phys}=="*LNXPWRBN*", \
          TAG-="power-switch", TAG+="seat", TAG+="uaccess"
    mode: '0644'
  when: not has_powerbutton_events
  notify:
    - Reload udev
    - Etckeeper commit

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Create /etc/systemd/system-sleep
  ansible.builtin.file:
    path: /etc/systemd/system-sleep
    state: directory
    mode: '0755'

- name: Install FUSE abort sleep hook
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/gatherd-unmount-fuse"
    dest: /etc/systemd/system-sleep/gatherd-unmount-fuse
    mode: '0755'
    remote_src: true
  notify: Etckeeper commit

- name: Install NFS abort sleep hook
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/gatherd-unmount-nfs"
    dest: /etc/systemd/system-sleep/gatherd-unmount-nfs
    mode: '0755'
    remote_src: true
  notify: Etckeeper commit

- name: Create /etc/systemd/system/systemd-suspend.service.d
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-suspend.service.d
    state: directory
    mode: '0755'

- name: Disable systemd user-session freeze before suspend
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-suspend.service.d/gatherd-no-freeze-user-sessions.conf
    content: |
      [Service]
      Environment="SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=false"
    mode: '0644'
  notify: Etckeeper commit

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Mask services that conflict with TLP
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - systemd-rfkill.service
    - systemd-rfkill.socket
    - power-profiles-daemon.service

- name: Install gatherd vault-gated systemd units
  ansible.builtin.file:
    src: "{{ setup_dir }}/services/system/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    state: link
  loop:
    - gatherd-vault.service
    - gatherd-async.service
    - gatherd-prompt-vault-console.service
  notify: Reload systemd

# Predecessor of the await-and-run services: a path unit watching .vault_pass
# re-fired the oneshot after every run and looped it into the start limit,
# leaving both units 'failed'. Remove the stale links on upgraded machines.
- name: Remove obsolete gatherd path units
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - gatherd-vault.path
    - gatherd-async.path
  failed_when: false
  changed_when: false

- name: Delete obsolete gatherd path unit links
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - gatherd-vault.path
    - gatherd-async.path
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start gatherd vault-gated services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    # Both units are ordered After=gatherd.service. Since this task runs from
    # inside gatherd.service, a blocking start deadlocks: systemd holds the start
    # job until gatherd.service finishes activating, but gatherd.service cannot
    # finish until this task returns. Enqueue the job without waiting on it.
    no_block: true
  loop:
    - gatherd-vault.service
    - gatherd-async.service
  # Started now so a fresh repave runs them this boot the moment .vault_pass
  # appears — each blocks waiting for it, so 'started' is not meaningful
  # idempotent state.
  changed_when: false

# The hinge-sensor systemd unit that used to live here is gone: the mechanism
# (chuwi-minibook-tablet-mode) replaced it with a udev rule that binds the
# base accelerometer the moment its i2c adapter appears, which works
# regardless of init system and needs no unit to enable or start. Linking that
# rule needs the mechanism's pinned clone, which is a network operation and so
# happens in REST, not CORE - see roles/desktop/tasks/tablet_mode_upstream.yml
# for the udev rule task and why it lives there instead of here.

# Enabled only, never started here: it is ordered Before=gatherd.service and runs
# at the NEXT boot's pre-gatherd window. Starting it now (from inside
# gatherd.service) would pop the console prompt mid-run. postinstall enables it
# for the very first boot; this keeps machines that predate the feature enabled
# for their next pave.
- name: Enable the early vault console prompt
  ansible.builtin.systemd:
    name: gatherd-prompt-vault-console.service
    enabled: true

# openssh is on the install medium, so unlike the rest of the service loop (which
# moved to rest.yml with the packages that provide those units) sshd can come up
# in CORE. Keep it here: if a machine boots to something unusable, SSH is the
# recovery path, and waiting for a post-login REST run to open it would mean the
# one tier that can fail is also the one that grants remote access.
- name: Enable and start sshd
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started

- name: Configure greetd PAM to start gnome-keyring at login
  ansible.builtin.lineinfile:
    path: /etc/pam.d/greetd
    line: "session    optional     pam_gnome_keyring.so auto_start"
  notify: Etckeeper commit

- name: Remove gnome-keyring PAM auth line (starts --login daemon with autologin, locking keyring with unknown password)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/greetd
    line: "auth       optional     pam_gnome_keyring.so"
    state: absent
  notify: Etckeeper commit

# Replace the EndeavourOS default behind the regreet login greeter with our own
# wallpaper — the same dark image GRUB and the lock screen use. regreet runs as
# the unprivileged 'greeter' user, so it reads the world-readable system cache
# (not the per-user copy). regreet re-reads its config at each greeter launch,
# so no service restart is needed.
- name: Point the regreet login greeter at our wallpaper
  ansible.builtin.lineinfile:
    path: /etc/greetd/regreet.toml
    regexp: '^path\s*='
    line: 'path = "{{ wallpaper_cache_dark }}"'
  when: wallpaper_cache_dark is exists
  notify: Etckeeper commit

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
