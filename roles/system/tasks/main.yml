---
# Split on the *network* axis, not importance (see docs/superpowers/plans/
# 2026-06-29-robust-convergence.md). core.yml is everything that converges with
# no internet at all — /etc essentials, logind/sleep policy, pam_env, sudo
# askpass, gatherd's own units. rest.yml is the package manager and everything
# that needs a package it installs.
#
# This importer keeps the monolith running both tiers in one pass; site-core.yml
# imports core.yml alone once the split is wired up.
- name: Converge the local-only system tier
  ansible.builtin.import_tasks: core.yml

- name: Converge the network-dependent system tier
  ansible.builtin.import_tasks: rest.yml
