---
- name: Create /etc/autofs
  ansible.builtin.file:
    path: /etc/autofs
    state: directory
    mode: '0755'

- name: Create /etc/autofs/auto.master.d
  ansible.builtin.file:
    path: /etc/autofs/auto.master.d
    state: directory
    mode: '0755'

- name: Write autofs master drop-in for ap-juicer
  ansible.builtin.copy:
    dest: /etc/autofs/auto.master.d/gatherd-ap-juicer.autofs
    content: "{{ target_home }}/.autofs-mounts  /etc/autofs/auto.gatherd-ap-juicer  --timeout=600\n"
    mode: '0644'
  notify:
    - Reload autofs
    - Etckeeper commit

- name: Write autofs map for ap-juicer
  ansible.builtin.copy:
    dest: /etc/autofs/auto.gatherd-ap-juicer
    content: "code  -fstype=nfs4,soft,timeo=15,retrans=3  {{ nfs_server }}:/export/code\n"
    mode: '0644'
  notify:
    - Reload autofs
    - Etckeeper commit

# Note: verbose autofs logging is set in the aur role, after the autofs AUR
# package (and its /etc/autofs/autofs.conf) is installed — patching it here, in
# the system play, would fail on a fresh repave because the file doesn't exist
# yet.

- name: Create ~/.autofs-mounts
  ansible.builtin.file:
    path: "{{ target_home }}/.autofs-mounts"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  changed_when: false

- name: Symlink ~/trees to NFS code mount
  ansible.builtin.file:
    src: "{{ target_home }}/.autofs-mounts/code/trees"
    dest: "{{ target_home }}/trees"
    state: link
    force: true
    follow: false
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Create autofs.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/autofs.service.d
    state: directory
    mode: '0755'

- name: Get target user UID for autofs ordering
  ansible.builtin.command: id -u {{ target_user }}
  register: target_uid
  changed_when: false

# Two ordering constraints for clean NFS unmount at shutdown (Before= reverses for stop):
# 1. Before=user-<uid>.slice: all user processes (terminals, Sway, etc.) die first,
#    releasing file handles on NFS mounts before autofs tries to unmount them.
# 2. After=tailscaled.service: autofs stops before tailscaled, so umount.nfs4 can
#    still reach the NFS server over Tailscale.
- name: Order autofs shutdown after user session and before tailscaled
  ansible.builtin.copy:
    dest: /etc/systemd/system/autofs.service.d/gatherd-tailscaled-ordering.conf
    content: |
      [Unit]
      Before=user-{{ target_uid.stdout }}.slice
      After=tailscaled.service
    mode: '0644'
  notify:
    - Reload systemd
    - Etckeeper commit
