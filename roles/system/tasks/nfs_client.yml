---
- name: Create /etc/autofs
  ansible.builtin.file:
    path: /etc/autofs
    state: directory
    mode: '0755'

- name: Create /etc/autofs/auto.master.d
  ansible.builtin.file:
    path: /etc/autofs/auto.master.d
    state: directory
    mode: '0755'

- name: Write autofs master drop-in for ap-juicer
  ansible.builtin.copy:
    dest: /etc/autofs/auto.master.d/gatherd-ap-juicer.autofs
    content: "{{ target_home }}/.autofs-mounts  /etc/autofs/auto.gatherd-ap-juicer  --timeout=600\n"
    mode: '0644'
  notify:
    - Reload autofs
    - Etckeeper commit

- name: Write autofs map for ap-juicer
  ansible.builtin.copy:
    dest: /etc/autofs/auto.gatherd-ap-juicer
    content: |
      # Path is relative to the NFSv4 pseudo-root: OMV exports /export with fsid=0,
      # so the share is /code here, though it is /export/code on disk (and for NFSv3).
      code  -fstype=nfs4,soft,timeo=15,retrans=3  {{ nfs_server }}:/code
    mode: '0644'
  notify:
    - Reload autofs
    - Etckeeper commit

# Note: verbose autofs logging is set in the aur role, after the autofs AUR
# package (and its /etc/autofs/autofs.conf) is installed — patching it here, in
# the system play, would fail on a fresh repave because the file doesn't exist
# yet.

- name: Create ~/.autofs-mounts
  ansible.builtin.file:
    path: "{{ target_home }}/.autofs-mounts"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  changed_when: false

- name: Symlink ~/trees to NFS code mount
  ansible.builtin.file:
    src: "{{ target_home }}/.autofs-mounts/code/trees"
    dest: "{{ target_home }}/trees"
    state: link
    force: true
    follow: false
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Create autofs.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/autofs.service.d
    state: directory
    mode: '0755'

- name: Get target user UID for autofs ordering
  ansible.builtin.command: id -u {{ target_user }}
  register: target_uid
  changed_when: false

# A FULL unit override, not a drop-in, and that is forced on us: dependency
# options are cumulative, and `Wants=`/`After=` with an empty value do NOT reset
# the inherited list. systemd documents that reset for Condition*= only. A
# drop-in can therefore ADD ordering but can never take autofs off
# network-online.target — it silently keeps the stock dependency. A file at
# /etc/systemd/system/autofs.service shadows the vendor unit entirely, which is
# the only way to drop one.
#
# Why it has to go: gatherd.service is already off network-online, but autofs is
# `WantedBy=multi-user.target` and `graphical.target` is `After=multi-user.target`,
# so greetd waits on autofs waits on network-online. An offline boot pays
# NetworkManager-wait-online's full timeout before reaching the greeter. autofs
# mounts on demand and our only map is nfs4, which needs neither network-online
# nor rpc-statd at start.
#
# The rest of the file is the vendor unit verbatim, plus two shutdown-ordering
# lines a drop-in did deliver correctly, kept here so it all lives in one place:
#
# 1. Before=user-<uid>.slice (Before= reverses for stop): all user processes die
#    first, releasing file handles on NFS mounts before autofs unmounts them.
# 2. After=tailscaled.service: autofs stops before tailscaled, so umount.nfs4 can
#    still reach the NFS server over Tailscale.
- name: Take autofs off network-online, and order it for clean shutdown
  ansible.builtin.copy:
    dest: /etc/systemd/system/autofs.service
    content: |
      [Unit]
      Description=Automounts filesystems on demand
      After=network.target remote-fs.target
      After=tailscaled.service
      Before=user-{{ target_uid.stdout }}.slice

      [Service]
      Type=notify
      EnvironmentFile=-/etc/default/autofs
      ExecStart=/usr/bin/automount $OPTIONS --systemd-service --dont-check-daemon
      ExecReload=/usr/bin/kill -HUP $MAINPID
      KillMode=process
      TimeoutSec=180

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify:
    # daemon-reload alone is enough here, and no autofs restart is wanted: this
    # replaces the unit's FragmentPath outright, so systemd reloads it fresh and
    # the new dependencies apply to the already-running autofs immediately
    # (verified: the network-online edges clear before any restart). Restarting
    # would drop the NFS automounts for no gain, and the [Service] block is
    # byte-identical to the vendor unit anyway.
    - Reload systemd
    - Etckeeper commit

# The override above is a snapshot of the vendor unit. Shadowing a packaged unit
# means pacman can change it under us and we would silently keep running the
# stale copy, so pin the version we copied from. Any upstream edit trips this —
# coarse on purpose, since every change to those twelve lines deserves a look.
- name: Read the vendor autofs unit
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/autofs.service
    checksum_algorithm: sha256
  register: autofs_vendor_unit

- name: Warn when the vendor autofs unit has drifted from our override
  ansible.builtin.debug:
    msg: >-
      /usr/lib/systemd/system/autofs.service changed upstream (now
      {{ autofs_vendor_unit.stat.checksum }}); re-check it against the override
      in roles/system/tasks/nfs_client.yml and update autofs_vendor_sha256.
  when:
    - autofs_vendor_unit.stat.exists
    - autofs_vendor_unit.stat.checksum != autofs_vendor_sha256

- name: Remove the superseded autofs ordering drop-ins
  ansible.builtin.file:
    path: "/etc/systemd/system/autofs.service.d/{{ item }}"
    state: absent
  loop:
    - gatherd-tailscaled-ordering.conf
    - gatherd-ordering.conf
  notify:
    - Reload systemd
    - Etckeeper commit
