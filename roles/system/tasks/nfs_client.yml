---
- name: Create /etc/autofs
  ansible.builtin.file:
    path: /etc/autofs
    state: directory
    mode: '0755'

- name: Create /etc/autofs/auto.master.d
  ansible.builtin.file:
    path: /etc/autofs/auto.master.d
    state: directory
    mode: '0755'

- name: Write autofs master drop-in for ap-juicer
  ansible.builtin.copy:
    dest: /etc/autofs/auto.master.d/gatherd-ap-juicer.autofs
    content: "{{ target_home }}/.autofs-mounts  /etc/autofs/auto.gatherd-ap-juicer  --timeout=600\n"
    mode: '0644'
  notify:
    - Reload autofs
    - Etckeeper commit

- name: Write autofs map for ap-juicer
  ansible.builtin.copy:
    dest: /etc/autofs/auto.gatherd-ap-juicer
    content: |
      # Path is relative to the NFSv4 pseudo-root: OMV exports /export with fsid=0,
      # so the share is /code here, though it is /export/code on disk (and for NFSv3).
      code  -fstype=nfs4,soft,timeo=15,retrans=3  {{ nfs_server }}:/code
    mode: '0644'
  notify:
    - Reload autofs
    - Etckeeper commit

# Note: verbose autofs logging is set in the aur role, after the autofs AUR
# package (and its /etc/autofs/autofs.conf) is installed — patching it here, in
# the system play, would fail on a fresh repave because the file doesn't exist
# yet.

- name: Create ~/.autofs-mounts
  ansible.builtin.file:
    path: "{{ target_home }}/.autofs-mounts"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  changed_when: false

- name: Symlink ~/trees to NFS code mount
  ansible.builtin.file:
    src: "{{ target_home }}/.autofs-mounts/code/trees"
    dest: "{{ target_home }}/trees"
    state: link
    force: true
    follow: false
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Create autofs.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/autofs.service.d
    state: directory
    mode: '0755'

- name: Get target user UID for autofs ordering
  ansible.builtin.command: id -u {{ target_user }}
  register: target_uid
  changed_when: false

# Everything gatherd has to say about autofs ordering, in ONE drop-in. Splitting
# it would mean relying on the alphabetical order in which systemd merges
# drop-ins for the reset below to land before the additions — self-contained is
# worth more than tidy filenames here.
#
# Wants=/After= with an empty value reset the inherited lists; the lines after
# them re-state only what we actually want:
#
# 1. Dropping the stock Wants/After=network-online.target (and rpc-statd) is what
#    finally takes the greeter off the network. gatherd.service no longer pulls
#    network-online in, but graphical.target -> autofs.service still did, so an
#    offline boot kept paying NetworkManager-wait-online's timeout. autofs mounts
#    on demand and our only map is nfs4, which needs neither at start.
# 2. Before=user-<uid>.slice (Before= reverses for stop): all user processes die
#    first, releasing file handles on NFS mounts before autofs unmounts them.
# 3. After=tailscaled.service: autofs stops before tailscaled, so umount.nfs4 can
#    still reach the NFS server over Tailscale.
- name: Order autofs, and take it off network-online
  ansible.builtin.copy:
    dest: /etc/systemd/system/autofs.service.d/gatherd-ordering.conf
    content: |
      [Unit]
      Wants=
      After=
      After=network.target
      After=tailscaled.service
      Before=user-{{ target_uid.stdout }}.slice
    mode: '0644'
  notify:
    - Reload systemd
    - Etckeeper commit

- name: Remove the superseded autofs ordering drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/autofs.service.d/gatherd-tailscaled-ordering.conf
    state: absent
  notify:
    - Reload systemd
    - Etckeeper commit
