---
# nowayprompt is neither a repo nor an AUR package (see packaging/nowayprompt/PKGBUILD
# for why it's vendored), so it can't live in aur_packages; it's listed in
# gatherd-check-package-tiers' ALLOWED dict instead.

- name: Read the pinned nowayprompt pkgver from the vendored PKGBUILD  # noqa: command-instead-of-module
  ansible.builtin.command: "grep -m1 -oP '(?<=^pkgver=).*' {{ setup_dir }}/packaging/nowayprompt/PKGBUILD"
  register: _nowayprompt_pkgver
  changed_when: false

- name: Read the pinned nowayprompt pkgrel from the vendored PKGBUILD  # noqa: command-instead-of-module
  ansible.builtin.command: "grep -m1 -oP '(?<=^pkgrel=).*' {{ setup_dir }}/packaging/nowayprompt/PKGBUILD"
  register: _nowayprompt_pkgrel
  changed_when: false

- name: Check whether nowayprompt is installed  # noqa: command-instead-of-module
  ansible.builtin.command: pacman -Q nowayprompt
  register: _nowayprompt_installed
  changed_when: false
  failed_when: false

# pkgver encodes the pinned _commit (see PKGBUILD), so comparing the full
# pkgver-pkgrel here -- not just presence -- catches a deliberate commit bump
# that a bare `pacman -Q nowayprompt` would miss.
- name: Build and install nowayprompt from the vendored PKGBUILD
  when: >-
    _nowayprompt_installed.rc != 0 or
    _nowayprompt_installed.stdout.split(' ')[1] != _nowayprompt_pkgver.stdout + '-' + _nowayprompt_pkgrel.stdout
  block:
    - name: Create a scratch directory for the nowayprompt build
      ansible.builtin.file:
        path: "{{ target_home }}/.cache/gatherd/nowayprompt"
        state: directory
        owner: "{{ target_user }}"
        mode: '0755'

    - name: Copy the vendored PKGBUILD into the scratch directory
      ansible.builtin.copy:
        src: "{{ setup_dir }}/packaging/nowayprompt/PKGBUILD"
        dest: "{{ target_home }}/.cache/gatherd/nowayprompt/PKGBUILD"
        owner: "{{ target_user }}"
        mode: '0644'
        remote_src: true

    # makepkg refuses to run as root at all, so the build targets the human
    # user. -sr builds and installs makedeps but does NOT install the result,
    # so no NOPASSWD sudoers grant is needed: the package is installed below
    # from this play's own root context instead.
    - name: Build nowayprompt
      ansible.builtin.command: makepkg -sr --noconfirm
      args:
        chdir: "{{ target_home }}/.cache/gatherd/nowayprompt"
      become: true
      become_user: "{{ target_user }}"
      changed_when: true

    - name: Find the built nowayprompt package
      ansible.builtin.find:
        paths: "{{ target_home }}/.cache/gatherd/nowayprompt"
        patterns: "*.pkg.tar.zst"
      register: _nowayprompt_built

    - name: Fail unless the build produced exactly one nowayprompt package
      ansible.builtin.fail:
        msg: >-
          Expected exactly one *.pkg.tar.zst in
          {{ target_home }}/.cache/gatherd/nowayprompt, found
          {{ _nowayprompt_built.files | length }}.
      when: _nowayprompt_built.files | length != 1

    - name: Install the built nowayprompt package
      community.general.pacman:
        name: "{{ _nowayprompt_built.files[0].path }}"
        state: present
