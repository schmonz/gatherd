---
# A graphical `sudo` (launched from a sway keybinding or app, with no controlling
# terminal) reads its password through an askpass helper. SUDO_ASKPASS in the
# environment normally points sudo at fuzzel, but that variable is only present
# in processes that inherited the pam_env login environment; anything started
# outside that chain falls through to /etc/sudo.conf's `Path askpass`, which on
# EndeavourOS can resolve to seahorse's ssh-askpass. Pinning the line here makes
# the fuzzel prompt the environment-independent default and overrides seahorse.

- name: Install gatherd-askpass for graphical sudo and ssh
  ansible.builtin.copy:
    src: "{{ setup_dir }}/scripts/gatherd-askpass"
    dest: /usr/local/bin/gatherd-askpass
    mode: '0755'
    remote_src: true

- name: Point sudo's no-terminal askpass at fuzzel, not seahorse
  # Match only an active (uncommented) Path askpass line, so the stock commented
  # examples stay intact and ours is appended; a seahorse line, if EndeavourOS
  # ships one, is rewritten in place instead of leaving two competing entries.
  # /etc/sudo.conf is a pacman backup file, so a sudo upgrade lands a .pacnew
  # rather than clobbering this line.
  ansible.builtin.lineinfile:
    path: /etc/sudo.conf
    regexp: '^\s*Path\s+askpass\s'
    line: Path askpass /usr/local/bin/gatherd-askpass
  notify: Etckeeper commit

# timestamp_type=global + timestamp_timeout share one credential cache across all
# of the user's processes (instead of per-TTY) so an agent shelling out to sudo
# repeatedly authenticates once, with a short window as a security cap.
#
# We deliberately do NOT set passprompt here. It would tag the fuzzel box as
# "[sudo]", but passprompt applies to every sudo prompt, so it also truncated the
# terminal prompt down from sudo's informative default ("[sudo] password for
# <user>:") to a bare "[sudo]" — which we want left alone on the command line.
# The fuzzel box is tagged the other way instead: gatherd-askpass collapses the
# default "[sudo] ..." prompt to the bare tag, so only the graphical prompt is
# shortened and the terminal keeps sudo's full default.
#
# validate keeps a malformed drop-in from ever breaking sudo.
- name: Configure sudo defaults (shared credential cache)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gatherd-sudo-defaults
    content: |
      Defaults:{{ target_user }} timestamp_type=global
      Defaults:{{ target_user }} timestamp_timeout=2
    mode: '0440'
    validate: visudo -cf %s
  notify: Etckeeper commit

# Old name before passprompt was folded in; remove so it isn't left orphaned.
- name: Remove superseded sudo timestamp drop-in
  ansible.builtin.file:
    path: /etc/sudoers.d/gatherd-sudo-timestamp
    state: absent
  notify: Etckeeper commit
