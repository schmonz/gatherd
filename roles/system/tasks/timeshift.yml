---
- name: Create /etc/timeshift directory
  ansible.builtin.file:
    path: /etc/timeshift
    state: directory
    mode: '0755'

- name: Configure Timeshift for BTRFS snapshots
  # Equivalent to running Timeshift GUI and clicking Finish. The UUIDs come
  # from machine_facts. do_first_run=false suppresses the wizard on launch.
  ansible.builtin.copy:
    dest: /etc/timeshift/timeshift.json
    content: |
      {
        "backup_device_uuid" : "{{ timeshift_backup_device_uuid }}",
        "parent_device_uuid" : "{{ timeshift_parent_device_uuid }}",
        "do_first_run" : "false",
        "btrfs_mode" : "true",
        "include_btrfs_home_for_backup" : "false",
        "include_btrfs_home_for_restore" : "false",
        "stop_cron_emails" : "true",
        "schedule_monthly" : "false",
        "schedule_weekly" : "false",
        "schedule_daily" : "true",
        "schedule_hourly" : "false",
        "schedule_boot" : "false",
        "count_monthly" : "2",
        "count_weekly" : "3",
        "count_daily" : "5",
        "count_hourly" : "6",
        "count_boot" : "5",
        "date_format" : "%Y-%m-%d %H:%M:%S",
        "exclude" : [],
        "exclude-apps" : []
      }
    mode: '0644'
  notify: Etckeeper commit

- name: Install Timeshift hourly check cron
  ansible.builtin.copy:
    dest: /etc/cron.d/timeshift-hourly
    content: |
      SHELL=/bin/bash
      PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin
      MAILTO=""

      0 * * * * root timeshift --check --scripted
    mode: '0644'
  notify: Etckeeper commit
