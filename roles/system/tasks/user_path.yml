---
# greetd launches sway directly with no login shell, so /etc/profile.d is never
# sourced for the desktop session. pam_env runs in greetd's PAM session stack
# (via system-login) before sway is exec'd, so sway and every process it spawns
# — terminals, swayidle, autostarted apps — inherit these. It also fires for
# console and SSH logins, so it covers the login shells profile.d used to.
- name: Set user-session environment (PATH, Go, Qt theme) via pam_env
  ansible.builtin.blockinfile:
    path: /etc/security/pam_env.conf
    # PATH base is set before the prepend so an unset PATH can never collapse to
    # a bare "~/.local/bin:" that would drop /usr/bin from the session.
    block: |
      PATH    DEFAULT=/usr/local/sbin:/usr/local/bin:/usr/bin
      PATH    OVERRIDE=@{HOME}/.local/bin:${PATH}
      GOPATH  DEFAULT=@{HOME}/.local/share/go
      GOBIN   DEFAULT=@{HOME}/.local/bin
      # Qt 6.7+ follows system light/dark from the XDG settings portal when this
      # is set. Via pam_env (not environment.d) so it reliably reaches greetd's
      # directly-exec'd sway session and every Qt app under it, hand-launched or
      # not — see the env-propagation note in plans/TODO.md.
      QT_QPA_PLATFORMTHEME    DEFAULT=xdgdesktopportal
    marker: "# {mark} ANSIBLE MANAGED BLOCK: gatherd user env"
  notify: Etckeeper commit

- name: Remove obsolete profile.d PATH file
  ansible.builtin.file:
    path: /etc/profile.d/gatherd-local-bin.sh
    state: absent
  notify: Etckeeper commit

- name: Remove obsolete profile.d Go file
  ansible.builtin.file:
    path: /etc/profile.d/gatherd-go.sh
    state: absent
  notify: Etckeeper commit

- name: Remove obsolete environment.d PATH file
  ansible.builtin.file:
    path: /etc/environment.d/10-gatherd-local-bin.conf
    state: absent
  notify: Etckeeper commit

- name: Remove obsolete environment.d Go file
  ansible.builtin.file:
    path: /etc/environment.d/10-gatherd-go.conf
    state: absent
  notify: Etckeeper commit
