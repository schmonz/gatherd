---
# Download the wallpaper images once, in the system play, to a system path shared
# by both consumers: the GRUB menu background (roles/hardware/tasks/grub_background.yml,
# same play, runs after this) and the user's desktop + lock-screen copies
# (roles/desktop/tasks/wallpaper.yml, later user play, copies locally — no re-fetch).
# Fetching here is what keeps the dark image from being pulled twice.
- name: Create wallpaper cache directory
  ansible.builtin.file:
    path: "{{ wallpaper_cache_dir }}"
    state: directory
    mode: '0755'

- name: Fetch wallpaper images
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: '0644'
  loop:
    - { url: "{{ hardcoded_wallpaper_dark_url }}", dest: "{{ wallpaper_cache_dark }}" }
    - { url: "{{ hardcoded_wallpaper_light_url }}", dest: "{{ wallpaper_cache_light }}" }
  when: item.url | length > 0
  loop_control:
    label: "{{ item.dest }}"
