---
# Manage connections through NetworkManager's D-Bus API (by name), not by writing
# keyfiles ourselves. Writing a keyfile gave each profile an Ansible-generated
# UUID that differed from the one Calamares wrote, so `nmcli connection reload`
# saw the active connection disappear and reappear and dropped the live WiFi link
# on the first run. nmcli compares the existing connection in place: if SSID, PSK,
# and method already match it reports ok and touches nothing — no reload, no blip.
# Two profile shapes share every field below except security: a personal network
# carries a PSK (key_mgmt defaults to wpa-psk), an enterprise network sets
# key_mgmt: wpa-eap and the 802-1x.* group reconciled further down. The split is
# by task rather than an inline conditional so each play line stays readable and
# the log says which kind it configured.
- name: Pre-configure known WPA-PSK WiFi networks
  community.general.nmcli:
    type: wifi
    conn_name: "{{ item.ssid }}"
    # Interface-independent so the profile roams across WiFi devices — and so it
    # autoconnects at all. connection.interface-name must be EMPTY for "any
    # device"; NM has no wildcard there (globbing lives only in the separate
    # match.interface-name). The nmcli module writes this field verbatim, so
    # ifname: '*' stores a LITERAL '*' that matches no device — NM then refuses to
    # activate ("mismatching interface name"), the profile never autoconnects, you
    # join via the GUI, and NM saves a duplicate "<ssid> 1". ifname: '' is the
    # empty value NM wants. (Omitting it is also wrong: the module defaults
    # connection.interface-name to conn_name.) NOTE: this only takes on CREATE —
    # the module skips empty desired values in its change detection, so it cannot
    # clear an interface-name an existing profile already carries; the reconcile
    # pair below handles that.
    ifname: ''
    ssid: "{{ item.ssid }}"
    autoconnect: true
    wifi_sec:
      key-mgmt: wpa-psk
      psk: "{{ item.psk }}"
    method4: auto
    method6: auto
    state: present
  loop: "{{ wifi_networks }}"
  when: (item.key_mgmt | default('wpa-psk')) == 'wpa-psk'
  loop_control:
    label: "{{ item.ssid }}"
  # The PSK is a vault secret and this play logs to the journal.
  no_log: true
  # nmcli applies the change live; NM rewrites the keyfile under /etc, so capture
  # it in etckeeper, but no connection reload is needed.
  notify: Etckeeper commit

# The module's wifi_sec dict maps only to 802-11-wireless-security.*: it can set
# key-mgmt: wpa-eap but has no field for the 802-1x.* group (EAP method, identity,
# password, phase2 auth). So create the base enterprise profile here — same
# roaming/autoconnect shape as PSK — and set the 802-1x.* properties with raw
# nmcli in the reconcile pair below, the same module-can't-so-nmcli-does pattern
# the interface-name unbind uses.
- name: Pre-configure known WPA-Enterprise (802.1x) WiFi networks
  community.general.nmcli:
    type: wifi
    conn_name: "{{ item.ssid }}"
    ifname: ''
    ssid: "{{ item.ssid }}"
    autoconnect: true
    wifi_sec:
      key-mgmt: wpa-eap
    method4: auto
    method6: auto
    state: present
  loop: "{{ wifi_networks }}"
  when: (item.key_mgmt | default('wpa-psk')) == 'wpa-eap'
  loop_control:
    label: "{{ item.ssid }}"
  notify: Etckeeper commit

- name: Read each WPA-Enterprise profile's current 802.1x settings
  # -g prints the requested fields one value per line, in order — so stdout_lines
  # is [eap, identity, phase2-auth] (each '' when unset, as on a freshly created
  # base profile). changed_when false: read-only probe.
  ansible.builtin.command:
    cmd: nmcli -g 802-1x.eap,802-1x.identity,802-1x.phase2-auth connection show "{{ item.ssid }}"
  register: wifi_eap_current
  changed_when: false
  loop: "{{ wifi_networks }}"
  when: (item.key_mgmt | default('wpa-psk')) == 'wpa-eap'
  loop_control:
    label: "{{ item.ssid }}"

- name: Configure 802.1x settings for WPA-Enterprise WiFi networks
  ansible.builtin.command:
    cmd: >-
      nmcli connection modify "{{ item.item.ssid }}"
      802-1x.eap {{ item.item.eap }}
      802-1x.identity "{{ item.item.identity }}"
      802-1x.phase2-auth {{ item.item.phase2_auth }}
      802-1x.password "{{ item.item.password }}"
  loop: "{{ wifi_eap_current.results }}"
  # Skip the profiles the read task skipped (PSK entries), and skip when the
  # readable fields already match — idempotent for the steady state. The password
  # is a vault secret nmcli reports as <hidden>, so it can't join the comparison:
  # it is (re)written whenever any structural field differs or the profile is new,
  # but a password-only rotation won't re-trigger here — delete the profile and
  # re-run to push a changed password.
  when:
    - item.skipped is not defined
    - item.stdout_lines != [item.item.eap, item.item.identity, item.item.phase2_auth]
  changed_when: true
  no_log: true
  loop_control:
    label: "{{ item.item.ssid }}"
  notify: Etckeeper commit

# The task above can create an interface-independent profile but cannot UNbind
# one that already names a device — the home network Calamares created at install
# is pinned to whatever interface it first joined on (e.g. wlan0). Left bound, it
# only autoconnects on a device of that exact name, defeating the roaming intent
# for the one network that matters most. Reconcile it directly with nmcli, which
# (unlike the module) does apply an empty connection.interface-name.
- name: Read each known WiFi profile's bound interface
  ansible.builtin.command:
    cmd: nmcli -g connection.interface-name connection show "{{ item }}"
  register: wifi_bound_iface
  changed_when: false
  loop: "{{ wifi_networks | map(attribute='ssid') | list }}"

- name: Unbind known WiFi profiles from a specific interface so they roam and autoconnect
  ansible.builtin.command:
    cmd: nmcli connection modify "{{ item.item }}" connection.interface-name ""
  loop: "{{ wifi_bound_iface.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | trim | length > 0
  changed_when: true
  notify: Etckeeper commit

- name: Write manifest of Ansible-managed WiFi SSIDs
  ansible.builtin.copy:
    dest: /etc/gatherd/managed-wifi.list
    content: "{{ wifi_networks | map(attribute='ssid') | sort | join('\n') }}\n"
    mode: '0644'
  notify: Etckeeper commit
