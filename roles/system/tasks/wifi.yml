---
# Manage connections through NetworkManager's D-Bus API (by name), not by writing
# keyfiles ourselves. Writing a keyfile gave each profile an Ansible-generated
# UUID that differed from the one Calamares wrote, so `nmcli connection reload`
# saw the active connection disappear and reappear and dropped the live WiFi link
# on the first run. nmcli compares the existing connection in place: if SSID, PSK,
# and method already match it reports ok and touches nothing — no reload, no blip.
- name: Pre-configure known WiFi networks
  community.general.nmcli:
    type: wifi
    conn_name: "{{ item.ssid }}"
    # Interface-independent so the profile roams across WiFi devices — and so it
    # autoconnects at all. connection.interface-name must be EMPTY for "any
    # device"; NM has no wildcard there (globbing lives only in the separate
    # match.interface-name). The nmcli module writes this field verbatim, so
    # ifname: '*' stores a LITERAL '*' that matches no device — NM then refuses to
    # activate ("mismatching interface name"), the profile never autoconnects, you
    # join via the GUI, and NM saves a duplicate "<ssid> 1". ifname: '' is the
    # empty value NM wants. (Omitting it is also wrong: the module defaults
    # connection.interface-name to conn_name.) NOTE: this only takes on CREATE —
    # the module skips empty desired values in its change detection, so it cannot
    # clear an interface-name an existing profile already carries; the reconcile
    # pair below handles that.
    ifname: ''
    ssid: "{{ item.ssid }}"
    autoconnect: true
    wifi_sec:
      key-mgmt: wpa-psk
      psk: "{{ item.psk }}"
    method4: auto
    method6: auto
    state: present
  loop: "{{ wifi_networks }}"
  loop_control:
    label: "{{ item.ssid }}"
  # The PSK is a vault secret and this play logs to the journal.
  no_log: true
  # nmcli applies the change live; NM rewrites the keyfile under /etc, so capture
  # it in etckeeper, but no connection reload is needed.
  notify: Etckeeper commit

# The task above can create an interface-independent profile but cannot UNbind
# one that already names a device — the home network Calamares created at install
# is pinned to whatever interface it first joined on (e.g. wlan0). Left bound, it
# only autoconnects on a device of that exact name, defeating the roaming intent
# for the one network that matters most. Reconcile it directly with nmcli, which
# (unlike the module) does apply an empty connection.interface-name.
- name: Read each known WiFi profile's bound interface
  ansible.builtin.command:
    cmd: nmcli -g connection.interface-name connection show "{{ item }}"
  register: wifi_bound_iface
  changed_when: false
  loop: "{{ wifi_networks | map(attribute='ssid') | list }}"

- name: Unbind known WiFi profiles from a specific interface so they roam and autoconnect
  ansible.builtin.command:
    cmd: nmcli connection modify "{{ item.item }}" connection.interface-name ""
  loop: "{{ wifi_bound_iface.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | trim | length > 0
  changed_when: true
  notify: Etckeeper commit

- name: Write manifest of Ansible-managed WiFi SSIDs
  ansible.builtin.copy:
    dest: /etc/gatherd/managed-wifi.list
    content: "{{ wifi_networks | map(attribute='ssid') | sort | join('\n') }}\n"
    mode: '0644'
  notify: Etckeeper commit
