---
# REST: everything that touches the network. Runs after login, once CORE has
# already delivered a usable session, so a captive portal can be cleared and a
# failure is recoverable rather than a lockout.
#
# The REST plays deliberately carry no any_errors_fatal: one package that will
# not install must not abort the remainder of a post-login convergence. CORE
# keeps it, because CORE is small, local, and gates the greeter.
- name: Detect target user and hardware
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  any_errors_fatal: true

  pre_tasks:
    - name: Detect target user and set facts
      ansible.builtin.include_tasks: tasks/detect_user.yml

  roles:
    - machine_facts


- name: System configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  # Both imported as tasks, not one of them in a roles: block, because order
  # matters and roles: would silently run first: the hardware role builds AUR
  # packages, and the system tier is what installs aurutils and creates the
  # local repository they build into.
  tasks:
    - name: Converge the network-dependent system tier
      ansible.builtin.import_role:
        name: system
        tasks_from: rest

    - name: Converge hardware-specific configuration
      ansible.builtin.import_role:
        name: hardware


- name: User configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_method: ansible.builtin.su
  become_user: "{{ target_user }}"
  environment:
    PATH: "{{ target_home }}/.local/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl:{{ ansible_env.PATH }}"
    GOPATH: "{{ target_home }}/.local/share/go"
    GOBIN: "{{ target_home }}/.local/bin"

  roles:
    - dotfiles
    - aur
    - claude_code

  tasks:
    - name: Converge the network-dependent desktop tier
      ansible.builtin.import_role:
        name: desktop
        tasks_from: rest

  post_tasks:
    - name: Build thinkfan into the local AUR repository
      ansible.builtin.command: "{{ aur_sync_command }} thinkfan"
      environment: "{{ aur_build_environment }}"
      register: _aur_sync_thinkfan
      changed_when: "'there is nothing to do' not in _aur_sync_thinkfan.stderr"
      when: has_thinkpad_hardware

    - name: Install thinkfan
      community.general.pacman:
        name: thinkfan
        state: present
        update_cache: true
      when: has_thinkpad_hardware
      become: true
      become_user: root

    - name: Enable thinkfan service
      ansible.builtin.systemd:
        name: thinkfan
        enabled: true
        # thinkpad_acpi must load with fan_control=1 (set by modprobe.d) before
        # thinkfan can start; that requires a reboot after first run.
      when: has_thinkpad_hardware
      become: true
      become_user: root

    - name: Set tailscale operator
      ansible.builtin.command: "tailscale set --operator={{ target_user }}"
      changed_when: false
      become: true
      become_user: root


- name: Slow system packages
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  tasks:
    - name: Install slow packages
      ansible.builtin.include_tasks: roles/system/tasks/slow.yml


- name: Slow AUR packages
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_method: ansible.builtin.su
  become_user: "{{ target_user }}"
  environment:
    # perlbin dirs are normally added by /etc/profile.d/perlbin.sh, but `su`
    # (not a login shell) skips profile.d, so pod2man lands off PATH and AUR
    # builds that need it (e.g. fprintd-clients-git) fail with "not found".
    PATH: "{{ target_home }}/.local/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl:{{ ansible_env.PATH }}"
    # Same reason for GOPATH/GOBIN: keep Go AUR builds' module cache out of ~/go.
    GOPATH: "{{ target_home }}/.local/share/go"
    GOBIN: "{{ target_home }}/.local/bin"

  # No vars_files: vault/vault.yml. It was needed when PIA logged in from vault
  # credentials; since those moved to 1Password this play has referenced nothing
  # but the aur_slow_* package vars and target_user/target_home. Keeping it meant
  # the whole REST tier could not be syntax-checked or linted without the vault
  # password, and tests/test — which seeds a dummy one — could not run REST at all.

  tasks:
    - name: Install slow AUR packages
      ansible.builtin.include_tasks: roles/aur/tasks/slow.yml

  post_tasks:
    - name: Read deployed git HEAD  # noqa: command-instead-of-module
      ansible.builtin.command: "git -C {{ setup_dir }} rev-parse HEAD"
      register: _gatherd_head
      changed_when: false
      become: true
      become_user: root

    - name: Mark slow setup complete
      # Sentinel records the HEAD that ran to completion; gatherd-needs-run
      # re-runs the play when HEAD later changes (e.g. after a git pull).
      ansible.builtin.copy:
        dest: /etc/gatherd/async-complete
        content: "{{ _gatherd_head.stdout }}\n"
        mode: '0644'
      become: true
      become_user: root
