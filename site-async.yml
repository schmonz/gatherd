---
- name: Detect target user and hardware
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  any_errors_fatal: true

  pre_tasks:
    - name: Detect target user and set facts
      ansible.builtin.include_tasks: tasks/detect_user.yml

  roles:
    - machine_facts


- name: Slow system packages
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  any_errors_fatal: true

  tasks:
    - name: Install slow packages
      ansible.builtin.include_tasks: roles/system/tasks/slow.yml


- name: Slow AUR packages
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_method: ansible.builtin.su
  become_user: "{{ target_user }}"
  any_errors_fatal: true
  environment:
    PATH: "{{ target_home }}/.local/bin:{{ ansible_env.PATH }}"

  vars_files:
    - vault/vault.yml

  tasks:
    - name: Install slow AUR packages
      ansible.builtin.include_tasks: roles/aur/tasks/slow.yml

  post_tasks:
    - name: Read deployed git HEAD  # noqa: command-instead-of-module
      ansible.builtin.command: "git -C {{ setup_dir }} rev-parse HEAD"
      register: _gatherd_head
      changed_when: false
      become: true
      become_user: root

    - name: Mark slow setup complete
      # Sentinel records the HEAD that ran to completion; gatherd-needs-run
      # re-runs the play when HEAD later changes (e.g. after a git pull).
      ansible.builtin.copy:
        dest: /etc/gatherd/async-complete
        content: "{{ _gatherd_head.stdout }}\n"
        mode: '0644'
      become: true
      become_user: root
