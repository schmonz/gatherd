---
# CORE: the only tier that gates greetd. Everything here converges with no
# internet at all — no package manager, no AUR, no downloads, no dotfiles clone —
# so a machine with a pulled cable, or trapped behind a captive portal, still
# reaches a usable Sway session that looks like yours. Everything network-shaped
# is REST and runs post-login from site-async.yml, where a portal can be cleared
# and a retry is cheap.
#
# Run by gatherd.service via scripts/gatherd-run-core, which syntax-checks,
# timeouts, records status to /etc/gatherd/last-run, and always exits 0.
- name: Detect target user and hardware
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  any_errors_fatal: true

  pre_tasks:
    - name: Detect an active Wayland/Sway session
      # WAYLAND_DISPLAY + XDG_SESSION_TYPE give an instant env-only answer
      # when sudo preserves them (sudo -E, or env_keep configured). Default
      # sudo strips them, so fall through to the sway IPC socket glob, which
      # is env-independent and faster than pgrep'ing all of procfs.
      ansible.builtin.shell: |
        [ -n "${WAYLAND_DISPLAY:-}" ] && exit 0
        [ "${XDG_SESSION_TYPE:-}" = "wayland" ] && exit 0
        ls /run/user/*/sway-ipc.*.sock >/dev/null 2>&1
      register: _sway_check
      changed_when: false
      failed_when: false

    - name: Refuse to run during a Sway session
      ansible.builtin.fail:
        msg: |
          site-core.yml is designed to run before greetd starts (via
          gatherd.service before login). Running it inside a live
          Sway session restarts services Sway depends on and will
          end the session. To re-run safely:
            - Reboot. gatherd.service re-runs if /etc/gatherd/core-complete is
              gone or records a git HEAD other than the deployed tree's.
            - Or switch to a console TTY (Ctrl+Alt+F2), stop greetd, then run.
            - Or pass -e sway_guard_override=true if you know what you're doing
              (e.g. an idempotency test inside a VM that's already past first boot).
      when:
        - _sway_check.rc == 0
        - not (sway_guard_override | default(false) | bool)

    - name: Detect target user and set facts
      ansible.builtin.include_tasks: tasks/detect_user.yml

  roles:
    - machine_facts


- name: System configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  any_errors_fatal: true

  tasks:
    # The hardware role is wholly REST: every capability it handles installs a
    # package or writes a bootloader config that needs one.
    - name: Converge the local-only system tier
      ansible.builtin.import_role:
        name: system
        tasks_from: core


- name: User configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  # su rather than sudo: the runner is root, so su requires no password and
  # works regardless of whether target_user has sudo configured yet.
  become_method: ansible.builtin.su
  become_user: "{{ target_user }}"
  any_errors_fatal: true
  environment:
    PATH: "{{ target_home }}/.local/bin:{{ ansible_env.PATH }}"
    # su skips profile.d, so set the Go workspace here too; otherwise AUR
    # builds that compile Go leave their module cache in ~/go.
    GOPATH: "{{ target_home }}/.local/share/go"
    GOBIN: "{{ target_home }}/.local/bin"

  tasks:
    # dotfiles (a git clone), aur, and claude_code (a get_url) are wholly REST.
    - name: Converge the local-only desktop tier
      ansible.builtin.import_role:
        name: desktop
        tasks_from: core

    - name: Converge the offline iCloud sync tier
      ansible.builtin.import_role:
        name: icloud
        tasks_from: core

  post_tasks:
    - name: Read deployed git HEAD  # noqa: command-instead-of-module
      ansible.builtin.command: "git -C {{ setup_dir }} rev-parse HEAD"
      register: _gatherd_head
      changed_when: false
      become: true
      # As root, not the play's target_user: setup_dir is a root-owned clone
      # (postinstall clones as root), and git refuses to read a repository owned
      # by someone else -- "detected dubious ownership", rc 128. On an
      # already-converged machine that is masked by safe.directory=* arriving in
      # the user's dotfiles, but dotfiles are REST and this is CORE, so a
      # genuinely fresh machine has no such exception yet.
      become_user: root

    - name: Mark core setup complete
      # Sentinel records the HEAD that ran to completion; gatherd-needs-run
      # re-runs the play when HEAD later changes (e.g. after a git pull).
      ansible.builtin.copy:
        dest: /etc/gatherd/core-complete
        content: "{{ _gatherd_head.stdout }}\n"
        mode: '0644'
      become: true
      become_user: root
