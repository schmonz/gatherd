---
- name: Detect target user and hardware
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  any_errors_fatal: true

  pre_tasks:
    - name: Detect target user and set facts
      ansible.builtin.include_tasks: tasks/detect_user.yml

  roles:
    - machine_facts


- name: Vault-protected system configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  any_errors_fatal: true

  vars_files:
    - vault/vault.yml

  handlers:
    - name: Reload NetworkManager connections
      ansible.builtin.command: nmcli connection reload
      changed_when: false

    - name: Etckeeper commit
      ansible.builtin.command: "etckeeper commit -m 'Ansible: converge vault-protected configuration.'"
      changed_when: false
      failed_when: false

  tasks:
    - name: Configure WiFi networks
      ansible.builtin.include_tasks: roles/system/tasks/wifi.yml

  post_tasks:
    - name: Read deployed git HEAD  # noqa: command-instead-of-module
      ansible.builtin.command: "git -C {{ setup_dir }} rev-parse HEAD"
      register: _gatherd_head
      changed_when: false

    - name: Mark vault setup complete
      # Sentinel records the HEAD that ran to completion; gatherd-needs-run
      # re-runs the play when HEAD later changes (e.g. after a git pull).
      ansible.builtin.copy:
        dest: /etc/gatherd/vault-complete
        content: "{{ _gatherd_head.stdout }}\n"
        mode: '0644'
