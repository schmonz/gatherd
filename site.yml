---
- name: Detect target user and hardware
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  any_errors_fatal: true

  pre_tasks:
    - name: Check whether a Sway session is currently active
      ansible.builtin.command: pgrep -x sway
      register: _sway_check
      changed_when: false
      failed_when: false

    - name: Refuse to run during a Sway session
      ansible.builtin.fail:
        msg: |
          site.yml is designed to run before greetd starts (via
          gatherd.service before login). Running it inside a live
          Sway session restarts services Sway depends on and will
          end the session. To re-run safely:
            - Reboot. gatherd.service will re-run if /etc/gatherd/complete is gone.
            - Or switch to a console TTY (Ctrl+Alt+F2), stop greetd, then run.
            - Or pass -e sway_guard_override=true if you know what you're doing
              (e.g. an idempotency test inside a VM that's already past first boot).
      when:
        - _sway_check.rc == 0
        - not (sway_guard_override | default(false) | bool)

    - name: Detect target user and set facts
      ansible.builtin.include_tasks: tasks/detect_user.yml

  roles:
    - machine_facts


- name: System configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  any_errors_fatal: true

  roles:
    - system
    - hardware


- name: User configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  # su rather than sudo: the runner is root, so su requires no password and
  # works regardless of whether target_user has sudo configured yet.
  become_method: ansible.builtin.su
  become_user: "{{ target_user }}"
  any_errors_fatal: true
  environment:
    PATH: "{{ target_home }}/.local/bin:{{ ansible_env.PATH }}"

  roles:
    - dotfiles
    - aur
    - desktop

  post_tasks:
    - name: Grant NOPASSWD pacman for thinkfan install
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        line: "{{ target_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
        validate: visudo -cf %s
      when: has_thinkpad_hardware
      become: true
      become_user: root

    - block: # noqa: name[missing]
        - name: Install thinkfan
          kewlfft.aur.aur:
            name: thinkfan
            use: yay
            state: present
          when: has_thinkpad_hardware
      always:
        - name: Revoke NOPASSWD pacman after thinkfan install
          ansible.builtin.lineinfile:
            path: /etc/sudoers
            line: "{{ target_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
            state: absent
            validate: visudo -cf %s
          when: has_thinkpad_hardware
          become: true
          become_user: root

    - name: Enable thinkfan service
      ansible.builtin.systemd:
        name: thinkfan
        enabled: true
        # thinkpad_acpi must load with fan_control=1 (set by modprobe.d) before
        # thinkfan can start; that requires a reboot after first run.
      when: has_thinkpad_hardware
      become: true
      become_user: root

    - name: Set tailscale operator
      ansible.builtin.command: "tailscale set --operator={{ target_user }}"
      changed_when: false
      become: true
      become_user: root

    - name: Mark setup complete
      ansible.builtin.copy:
        dest: /etc/gatherd/complete
        content: ""
        mode: '0644'
      become: true
      become_user: root
